techniques:
  - id: section-cut-slideshow
    what: >
      An entire scrolling marketing site is rendered as 6 fully-pre-built,
      full-bleed frames (hero, problem, feature-grid, testimonials,
      integrations+footer, loop-back-to-hero), each entering with a fast
      sub-half-second stagger/mask build then holding fully static for
      1.9-2.6s, joined only by hard cuts. There is no scroll transform, no
      parallax, and no camera move of any kind simulating scrolling anywhere
      in the video.
    where: shots 1-6 (whole video)
    why_it_reads: >
      Showing each fold as a finished, fully-readable composition rather than
      a moving scroll gives the eye complete read-time on real product copy;
      the hard cuts read as "flipping through the finished site" rather than
      "watching someone scroll," which suits a launch teaser meant to be
      understood muted in a feed.
    remotion_recipe: >
      Render each site section as its own <Sequence> using the exact page
      layout component from the live site, with zero scroll/translateY applied
      to a "page" container. Enter each section's heading + content with one
      staggerRise/maskWipeUp pass, hold the sequence static for
      durationInFrames minus the entrance frames, then hardCut (0f) into the
      next <Sequence>. No IntersectionObserver or scrollTo simulation is
      needed - it is a slideshow of the site's fold states, not a scroll.
    difficulty: trivial
  - id: card-fan-hero-reveal
    what: >
      Three overlapping product-screenshot cards fan in behind the hero
      headline: the largest sits topmost and centred, the other two are offset
      down-left/down-right at roughly -6deg/+6deg rotation with a small
      z-depth/shadow stack between them. All three land within ~18 native
      frames (60fps, ~0.3s) of a spring settle.
    where: shot 1, frames 6-24 (identically replayed in shot 6)
    why_it_reads: >
      A fanned stack of real product screenshots reads as "here is a live
      product with real screens" in one glance; the small alternating
      rotation (rather than a stacked-and-aligned pile) makes it feel curated
      by hand rather than auto-generated.
    remotion_recipe: >
      Absolutely position 3 card components in a shared relatively-positioned
      container. Give each a fixed target rotate (e.g. -6deg, 0deg, +6deg),
      target translateY (top card 0px, others +30px/+40px) and z-index by
      depth order. Animate each from {y: +50, opacity: 0, scale: 0.92} to its
      target with spring({damping:200, mass:0.6, stiffness:100}), starting
      each card's spring 4 frames after the previous one. Apply box-shadow:
      0 18px 48px rgba(0,0,0,0.18) per card for the "fan of paper" depth cue.
    difficulty: trivial
  - id: gradient-aurora-blob-backdrop
    what: >
      A large, softly blurred multi-hue gradient shape (purple to orange to
      teal, and separately a green/purple/pink variant behind the
      testimonials) sits behind foreground UI content, filling roughly the
      bottom 55-60% of the frame with heavily gaussian-blurred edges so it
      reads as an ambient light wash rather than a hard shape.
    where: shots 1, 4, 6
    why_it_reads: >
      Gives an otherwise flat white/navy UI a sense of light source and
      warmth without competing with the mostly monochrome product content.
      It is purely decorative in this reference - confirmed from the sheets
      and motion.csv that it does not drive any reveal or clip; it is a
      static (or near-static) backdrop layer, not a mask.
    remotion_recipe: >
      A single large <div> behind the content z-index using either a CSS
      conic-gradient()/radial-gradient() stack or a pre-rendered blurred PNG,
      with filter: blur(60-70px). Fade opacity 0 to 1 over ~16-20f on shot
      entry alongside the other entrance moves. To fix the ambient-motion gap
      this reference leaves on the table, drive background-position or a hue-
      rotate CSS custom property slowly (gradientDrift, period_f 300-400)
      instead of leaving it static once faded in.
    difficulty: trivial

rhythm:
  cut_count: 5
  median_shot_f: 141
  fastest_f: 40
  slowest_f: 154
  pattern: >
    40f hero snap-in -> 144f frozen problem-statement hold -> 147f feature-grid
    hold (containing an undetected soft cut around f330 that the delta-threshold
    detector missed) -> 138f testimonial hold -> 154f integrations+footer hold
    (longest single frozen dead zone in the video) -> 113f hard-cut loop back to
    the opening hero. Every shot is entrance-then-static; there is no mid-shot
    camera movement anywhere.
  beat_grid_f: null
  energy_curve: flat

transferable:
  - Compress a scrolling site into a hard-cut deck of its fold-states instead
    of simulating scroll (technique section-cut-slideshow) - it is dramatically
    cheaper to build than any scroll-camera rig and reads just as intentional.
  - Fan 2-3 product screenshots at small alternating rotation angles for a
    hero (technique card-fan-hero-reveal) instead of a single flat screenshot.
  - Reserve two short category-label colours (teal, orange here) above
    alternating feature-grid headlines so consecutive rows read as distinct
    without needing distinct layouts.
  - Mirror the icon/text column order between consecutive feature rows
    (icon-left/text-right, then text-left/icon-right) purely via a flipped
    grid-template, so two rows in a row don't look identical.
  - Loop a launch video for free by hard-cutting back to the exact settled
    hero frame at the very end - no new animation needed, it is the same
    composition replayed.
  - A blurred multi-hue gradient div (technique gradient-aurora-blob-backdrop)
    behind a screenshot stack is a single filter:blur() layer, far cheaper
    than a real glow/bloom pass, and reads expensive against flat UI.

avoid:
  - Four separate frames (frames 101-144, 238-291, 383-432, 520-580 per
    profile.md) sit fully frozen for 0.7-1.0s each with zero ambient motion -
    a straight slideshow hold, violating PRINCIPLES.md rule 4. Keep the same
    read-time length in code-native work but run a `breathe` (scale
    1->1.015) or `driftCamera` (~1% amp) under every hold instead of a truly
    dead frame.
  - The single global luma-delta cut detector (threshold 26.0) missed a real
    content cut around frame 330-340 (feature-grid to testimonial carousel)
    because the transition has no flash and low overall delta. Don't trust
    one global threshold when auditing or generating scene cuts against a
    reference - cross-check the sheets directly, as done here.
  - The "aurora" gradient blob looks expensive but is not a shape-mask effect
    despite this batch's brief to hunt for shape-driven masking - do not
    over-engineer it as an animated SVG mask; a single blurred gradient div
    is the entire technique.

new_moves:
  - name: cardFanReveal
    params: {count: 3, rotate_range_deg: [-6, 6], y: [50, 0], stagger_f: 4, z_offset: 10px, dur_f: 18, ease: springSoft}
    description: >
      N overlapping cards (usually product screenshots) enter as a fanned
      stack rather than a straight vertical pile: each card gets a fixed
      target rotation spread evenly across rotate_range_deg, a shared y
      travel distance, and a z_offset per depth layer, staggered stagger_f
      frames apart, all resolved by one spring per card. Reads as a curated
      "hand of cards" rather than an auto-stacked list. Distinct from
      slideStackIn (which keeps all layers axis-aligned, no rotation).
  - name: auroraBlobBackdrop
    params: {blur_px: 60, opacity: [0, 1], dur_f: 20, drift_period_f: 350}
    description: >
      A large, heavily blurred multi-hue gradient shape placed behind
      foreground content purely as an ambient light/colour wash - not a
      reveal mechanism or mask. Fades in with a shot's other entrance moves
      via opacity; optionally drifts slowly afterward (background-position or
      hue-rotate over drift_period_f) to satisfy the "nothing is ever still"
      rule, though the reference this move was extracted from leaves it
      static once faded in.

convergence:
  - >
    No confident convergence found against the one available @byshubh_
    example spec (A_explainer-zhylar-crm-cpq): that reference is
    icon/illustration-driven, top-down/vector-illustration heavy, with 3D
    raked UI cards and green toast confirmations, while this reference is a
    flat, non-3D, hard-cut website slideshow with no toasts, no word-cycle
    text, and no 3D card entrances. Only generic shared vocabulary
    (staggerRise, scaleIn, popIn, dropShadowSoft) overlaps - that is shared
    grammar, not a specific reusable technique convergence.

detection_notes: >
  Split profile.md's shot 3 (frames 184-468, 4.75s) into two real content
  shots here (shot 3: 184-330, feature grid; shot 4: 331-468, testimonial
  carousel) after cross-checking the sheets: sheet_01 row 6 shows the feature
  grid still on screen at frame 334 and the testimonial carousel already
  fully on screen at frame 344, and the "loudest 8x8 tile" motion sparkline
  in profile.md shows a small independent blip at frames ~308-330 that the
  primary delta>26.0 cut detector did not register as a full shot boundary
  (likely because the transition has no flash and a low full-frame delta).
  All other profile shot boundaries (0/39, 40/183, 469/622, 623/735) were
  confirmed correct against the sheets and required no merging - this
  reference had an under-detection (a missed real cut), not the usual
  over-detection (false-positive flash shots) seen in other references in
  this library.
