id: evanplace_A_web-design-for-momentum
source: local-reference (evanplace_A_web-design-for-momentum.mp4)
category: ui-showcase
product_type: visual-product

format:
  aspect: "16:9"
  fps: 60
  duration_s: 12.267
  orientation: horizontal

verdict: >
  A whole marketing-site scroll is compressed into six full-bleed, hard-cut "slides"
  (hero, problem, feature-grid, testimonials, integrations+footer, loop-back-to-hero)
  with zero scroll or parallax simulation anywhere — each section snaps fully built
  in well under half a second, then holds static for 1.9-2.6s of pure read-time before
  the next cut, and the tape loops by hard-cutting back to the opening hero frame.
  Note: all `dur_f`/`at_f` values below are given in this source's NATIVE 60fps frame
  count (matching the profile/sheets ground truth) — halve them for a 30fps build.

palette:
  bg: "#F4F4F6"
  ink: "#181830"
  accent: "#2FD9B0"
  support: ["#7C3AED", "#F5A623", "#181830"]
  notes: >
    Off-white/light-grey product chrome (screen-share dominant colours #D8D8D8 47.9%,
    #F0F0F0 30.6%) against a near-black navy ink (#181830, #303048) for headlines and
    the footer panel. Mint/teal (~#2FD9B0, the "momentum" logo mark and the
    "Automated Workflows" category label) is the only recurring accent. Purple
    (~#7C3AED) shows up exactly twice: the Slack-notification card header bars and
    the blurred gradient "aurora" blob behind the hero and testimonial sections.
    Orange (~#F5A623) is used once, only for the second feature row's category label
    ("Coaching & Discovery"), functioning as a second-category colour code rather than
    a true accent.

typography:
  family_look: geometric sans
  weights: [medium, bold]
  case: sentence
  tracking: normal
  headline_frame_share: 0.42
  notes: >
    Every headline is a 2-line sentence-case fragment, 4-6 words per line
    ("Work your pipeline at / the speed of AI", "Manual admin and missing data are
    slowing / your team down. Let's fix that."). Small uppercase-adjacent category
    labels (e.g. "Automated Workflows", "Coaching & Discovery") sit above feature
    headlines in the accent/support colours as row identifiers. Body copy is a
    smaller weight of the same geometric sans at roughly 14px equivalent, capped at
    2-3 lines, always followed by a "Learn more ->" text link where present.

structure:
  - act: hook
    t: [0.00, 0.65]
    purpose: Establish the "momentum" brand and headline value prop with a fanned product-screenshot hero.
    shots: [1]
  - act: problem
    t: [0.67, 3.05]
    purpose: Name the pain point ("manual admin and missing data") and immediately answer it with a real Slack notification screenshot.
    shots: [2]
  - act: capability
    t: [3.07, 5.50]
    purpose: Show the two headline product benefits as an alternating icon/text feature grid.
    shots: [3]
  - act: proof
    t: [5.52, 7.80]
    purpose: Back the claims with three customer-quote cards.
    shots: [4]
  - act: capability
    t: [7.82, 10.37]
    purpose: Show ecosystem breadth (integrations) and land on the site footer as an implicit "this is a real, finished site" beat.
    shots: [5]
  - act: cta
    t: [10.38, 12.25]
    purpose: Hard-cut back to the exact opening hero frame so the clip loops seamlessly on autoplay.
    shots: [6]

