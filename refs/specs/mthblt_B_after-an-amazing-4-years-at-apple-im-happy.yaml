id: mthblt_B_after-an-amazing-4-years-at-apple-im-happy
source: https://x.com/mthblt
category: brand-loop
product_type: visual-product

format:
  aspect: "16:9"
  fps: 30
  duration_s: 15.533
  orientation: horizontal

verdict: >
  A farewell/portfolio reel built almost entirely from real Apple.com screen captures cut
  on a fast beat grid, proving that scroll itself — not hand-keyframed animation — is the
  camera move: pages crossfade imagery in place at fixed scroll checkpoints, and two
  recurring icon-shape mask-scale transitions (a lightning bolt, a house) do the heavy
  lifting of moving between chapters without a single wipe or dissolve.

palette:
  bg: "#F0F0F0"
  ink: "#000000"
  accent: "#4CFF3C"
  support: ["#FF5A3C", "#FF9500", "#D83CA0", "#3C78D8"]
  notes: >
    Base chrome is neutral (near-white product pages, near-black immersive panels) —
    #000000 28.8%, #D8D8D8 28.7%, #F0F0F0 23.0% of total screen time per the profile.
    Unlike a single-accent brand film, each "chapter" gets its own accent tied to the
    product being shown: red for AirPods Max editorial, green for the AirPods 3
    fast-charge glyph, orange for the Home app glyph, magenta/blue for the AirPods 3
    campaign photography, blue for the Vision Pro entertainment swirl. The accent never
    mixes across a cut — one color owns one chapter, then is fully retired.

typography:
  family_look: geometric sans
  weights: [medium, bold]
  case: sentence
  tracking: normal
  headline_frame_share: 0.4
  notes: >
    Apple's own site typography (SF Pro) throughout, untouched — this reel's craft is in
    the edit and the transitions, not in custom type. Headline cards ("A higher
    definition of TV", "and longer battery life that charges up in a snap.", "The
    foundation for a smarter home.") run 1-2 lines, centered or left-aligned to match
    the source page's own layout.

structure:
  - act: hook
    t: [0.0, 3.57]
    purpose: establish breadth — three flagship product pages (AirPods Max, Vision Pro) in one unbroken scroll-and-crossfade rhythm, bridged by a 3D icon-room vignette
    shots: [1, 2, 3]
  - act: capability
    t: [3.6, 9.4]
    purpose: show a real scroll-driven hero transition (Apple TV) then a high-energy tilted-grid campaign montage (AirPods 3) proving range across both restrained and maximalist site styles
    shots: [4, 5, 6, 7, 8]
  - act: reveal
    t: [9.4, 12.5]
    purpose: two icon-shape mask-scale transitions (bolt, house) used as the connective tissue between chapters — the signature move of this edit
    shots: [9, 10, 11, 12]
  - act: proof
    t: [12.53, 14.9]
    purpose: close on Vision Pro's most immersive material — face-lit-by-headset, then the ultimate-theater copy over ambient room footage
    shots: [13]
  - act: cta
    t: [14.9, 15.533]
    purpose: end on a tactile, personal note — a hand holding an iPad, dragging to orbit a 3D product render on its screen, video ends mid-gesture
    shots: [13]

shots:
  - n: 1
    t: [0.00, 1.30]
    frames: [0, 38]
    layout: full-bleed-ui
    content: >
      AirPods Max product page. f0-19: static hero, "AirPods Max" wordmark over the
      product shot, nav bar visible top. f20-26: page content crossfades in place to an
      editorial red diptych (arm raised against red ear-cushion macro) with no scroll
      indicator movement — a scroll-linked image swap, not a slide. f27-31: crossfades
      again to a dark teal-lit portrait of a woman wearing the headphones. f32-38:
      crossfades to a black "Hear every detail" spec panel with an ear-cushion product
      render and body copy.
    moves:
      - move: scrollLinkedCrossfade
        target: hero_imagery_stack
        at_f: 20
        params: {swap_count: 3, hold_f: [7, 5, 6], crossfade_f: 4, ease: expoInOut, note: "each image swap coincides with a virtual scroll checkpoint; no imagery translates, only opacity-crossfades in place"}
    camera: {move: driftCamera, params: {amp_pct: 0.4, period_f: 160, axes: xy}}
    bg: {kind: flat, moves: []}
