detection_notes: >
  Automated detector found 24 cuts; this spec consolidates to 13 shots. Merges (false
  positives — same page, scroll-linked crossfade not a real cut): raw shots 1+2+3
  (f0-38) → shot 1; raw shots 4+5+6+7+8 (f39-87) → shot 2; raw shots 10+11 (f108-154) →
  shot 4; raw shots 16+17+18 (f314-333) → shot 10; raw shots 21+22+23+24 (f376-464) →
  shot 13. One correction in the other direction — an under-detected cut: raw shot 12
  (f155-178, reported as one 24f shot) actually contains two distinct pages ("Beastie
  Boys Story" promo card f155-161, then AirPods macro photography f162-178) with no
  qualifying luma delta between them because both are high-contrast black/white
  compositions; split into shots 5 and 6.

techniques:
  - id: icon-shape-mask-scale-transition
    what: >
      A flat, small UI/app icon (a lightning bolt, a house) sitting on its normal page
      background scales up around its own center — not the whole page, just the icon —
      until its silhouette exceeds the viewport, at which point only its fill color is
      visible full-bleed. The icon's shape briefly IS the mask: everything outside its
      outline is still the old page for the first portion of the move, and only the
      icon's fill is visible once it has grown past frame edges.
    where: shots 9 and 12 (bolt f282-313, house f342-375)
    why_it_reads: >
      Because the icon is already legible brand iconography from the page you were just
      looking at, growing it into a full-bleed color card feels like "zooming into the
      meaning of the icon" rather than an arbitrary wipe — the transition is motivated by
      content, not decoration. Using it twice with different easing (clean expoIn for the
      bolt, an overshoot-then-continue curve for the house) confirms it's a reusable
      template, not a one-off effect.
    remotion_recipe: >
      Render the icon as an inline SVG (not a raster PNG) so its path can be used as a
      CSS clip-path or SVG <clipPath>. Animate a single `scale` transform on a wrapper
      div containing the SVG, transform-origin at the icon's visual center, from scale(1)
      to a large value (40-60x, enough that the shape's outline crosses every viewport
      edge well before scale completes) driven by an expoIn (or expoInOut with a
      deliberate mid-curve dip, per shot 12) easing over ~30f. Do NOT crossfade a second
      "filled" layer on top — the illusion depends on the SAME element's fill simply
      exceeding the frame, so the fill color is on the icon shape itself from frame 0.
      Cut to the next scene the instant the shape's bounding box fully covers the
      viewport (verify per-frame, don't hardcode a duration that might undershoot at
      different aspect ratios).
    difficulty: moderate

  - id: scroll-linked-imagery-crossfade
    what: >
      Across every real Apple.com page capture in this reel (AirPods Max, Vision Pro,
      AirPods 3), the "scroll" is not a translating camera — it is a sequence of hero
      images crossfading in place at fixed scroll checkpoints while the page chrome
      (nav bar) stays static. Each image holds 5-15f, crossfades over ~4-6f, and the
      layout never moves.
    where: shots 1, 2, 7, 13
    why_it_reads: >
      It reproduces exactly how Apple's own scroll-jacked product pages behave (pinned
      section, content swaps as you scroll past breakpoints) so the reel reads as
      authentic screen capture rather than an edited slideshow, even though structurally
      it is one.
    remotion_recipe: >
      Stack N absolutely-positioned image/content layers in one container. Drive a
      single discrete `activeIndex` off frame number (or off a virtual scrollY value if
      you want the metaphor literal), and crossfade opacity between activeIndex and
      activeIndex+1 over a fixed 4-6f window centered on each checkpoint frame — plain
      opacity crossfade, no transform on the images themselves. This is the one
      legitimate case in the whole vocabulary where "opacity animates alone" is
      acceptable, because the page chrome around it is static and unmoving, giving the
      opacity change a fixed frame of reference.
    difficulty: trivial

  - id: pinned-scroll-hero-swap
    what: >
      The Apple TV hero: a row of app icons translates straight up and off the top of
      the viewport (past the nav bar) while the headline copy translates up from below
      into the space the icons vacated, and the product shot beneath settles to a
      slightly smaller scale. Motion.csv shows the velocity peaking at f123-125 (~35%
      into a 23f window starting f118), i.e. an ease-in-out curve, not linear.
    where: shot 4, frames 118-141
    why_it_reads: >
      This is the one moment in the reel where scroll genuinely reads as a camera move
      rather than a crossfade — two layers translate on independent but synchronized
      paths, which is exactly what a real pinned-scroll hero does, and reproducing the
      eased velocity (not linear) is what sells it as intentional rather than a
      scrollbar drag.
    remotion_recipe: >
      Two absolutely-positioned layers (icon row, headline block) inside one pinned
      section. Drive both off the same progress value p (0-1, expoInOut, 23f): icon row
      `translateY: interp(p, [0,1], [0,-180])`, headline `translateY: interp(p, [0,1],
      [40,0])` + `opacity: interp(p, [0,0.4], [0,1])`. Use the SAME progress value and
      SAME easing curve for both layers so they feel physically linked to one scroll
      gesture rather than two separate animations that happen to run concurrently.
    difficulty: trivial

  - id: device-within-device-orbit
    what: >
      The closing shot frames a hand holding an iPad in portrait; the iPad's own screen
      shows a website (Vision Pro's product configurator, complete with its own browser
      chrome), and a thumb visibly drags across that inner screen to orbit a 3D product
      render through ~140° of rotation before the video ends mid-gesture.
    where: shot 13, frames 437-464
    why_it_reads: >
      Nesting a screen inside a screen, held by a visible hand, makes the whole reel's
      preceding full-bleed captures retroactively feel like "a website, being used by a
      person" rather than abstract motion graphics — it's the one shot that breaks the
      full-bleed convention on purpose, and doing it last makes it the takeaway image.
    remotion_recipe: >
      Composite: (1) a locked photo/video plate of a hand holding an iPad frame at a
      fixed angle (~8° from vertical) with a soft ambient shadow under the device; (2)
      the "inner screen" content rendered separately and warped/positioned via a CSS 3D
      transform or a perspective homography to sit exactly inside the iPad's screen
      bezel in the plate. Drive the 3D product render's rotateY with a slightly jittery,
      non-eased (near-linear but with small random-walk perturbation seeded from frame
      index, NOT Math.random()) curve to simulate an uneven hand-drag rather than a
      programmatic easing — the imperfection is what sells "someone is actually touching
      this."
    difficulty: hard

rhythm:
  cut_count: 13
  median_shot_f: 33
  fastest_f: 7
  slowest_f: 75
  pattern: >
    two long scroll-and-crossfade page reads (58f, 49f) → a short 3D-room bridge (20f) →
    one genuine scroll-camera hero (47f) → two rapid-fire product beats (7f, 17f) →
    a hero+graphic page (28f) → the single longest, hottest-energy shot in the edit, a
    tilted-grid campaign montage (75f) → two icon-mask-scale reveal beats (32f, 8f, 34f)
    → a long closing Vision Pro sequence that ends unresolved mid-gesture (88f).
  beat_grid_f: 0
  energy_curve: rising

transferable:
  - Use an icon's own SVG path as the mask/subject of a scale transition between chapters
    instead of a generic wipe — scale it from icon-size to 40-60x around its own center
    so its fill becomes the next scene's full-bleed background color.
  - Reproduce a real product page's scroll behavior as opacity-crossfading stacked
    layers with a static nav chrome, not as a sliding/translating camera — this is the
    one place a bare opacity crossfade is earned.
  - When you do need scroll to read as a literal camera move (not a crossfade), drive
    two or more layers off one shared progress value and one shared easing curve so they
    feel physically linked, not independently animated.
  - Vary the easing signature of a repeated signature move (clean expoIn vs. an
    overshoot-then-continue curve) between its two uses in an edit so a recurring
    technique doesn't read as a copy-pasted preset.
  - Close a reel on an unresolved gesture (a drag mid-rotation) rather than a settled
    hold — it reads as "keep imagining this" rather than "the end."
  - Let each chapter fully own one accent color and retire it completely at the cut —
    never blend two chapters' accents across a transition.

avoid:
  - Hand-animating the icon-to-fullscreen transition as two separate elements (an icon
    that fades out, a color card that fades in); it must be one scaling element so the
    edge-crossing-frame moment happens for free, at whatever point the math produces it.
  - Treating the 75f tilted-grid montage shot as one hand-tuned After Effects camera
    move; build it as a 3D-transformed grid of planes with a single shared
    perspective/rotation driven by one progress value, same principle as the isometric
    dashboard technique in the byshubh_ corpus.
  - Simulating the iPad-drag rotation with a clean spring or bezier; a real hand-drag has
    uneven velocity, and a mathematically smooth curve there reads as fake immediately.

new_moves:
  - name: iconMaskScale
    params: {scale: [1, 55], transform_origin: center, dur_f: 30, ease: expoIn, fill_color: "#hex", overshoot_pct: 0}
    description: >
      A single flat icon (rendered as SVG so its outline is a true path, not a raster)
      scales up around its own center from its normal in-page size to 40-60x, so its
      silhouette exceeds the viewport bounds partway through the move. The icon's fill
      color becomes the full-bleed background of the next beat the instant its edges
      cross the frame. No separate crossfade layer — the mask IS the icon.
  - name: scrollLinkedCrossfade
    params: {swap_count: 3, hold_f: [8, 8, 8], crossfade_f: 5, ease: expoInOut}
    description: >
      A stack of absolutely-positioned hero images/content blocks inside one static-chrome
      page section, crossfading opacity between adjacent layers at fixed intervals to
      simulate a scroll-jacked pinned section, with no layer translating.
  - name: scrollPinnedSwap
    params: {icon_row_translateY_px: [0, -180], headline_translateY_px: [40, 0], dur_f: 23, ease: expoInOut, peak_velocity_at_pct: 0.35}
    description: >
      Two (or more) layers within a pinned scroll section translate on independent paths
      driven by one shared progress value and easing curve — one element exits (e.g.
      upward, off-frame) while another enters into the vacated space — reproducing a real
      website's scroll-triggered hero handoff.
  - name: dragOrbit3D
    params: {rotateY_deg: [0, 140], perspective_px: 900, dur_f: 27, ease: linear, driven_by: simulated_pointer_drag}
    description: >
      A 3D object's rotateY is driven by a near-linear but frame-seeded, slightly
      irregular curve (not a clean bezier/spring) to simulate a human dragging a pointer
      across a touchscreen to orbit a product render — the imperfection is the point.

