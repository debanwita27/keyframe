        at_f: 95
        params: {dur_f: 140, node_count: 24, stagger_f: 3, ease: expoOut, direction: expand}
      - move: radialNodeBurst
        target: account_orbit_nodes
        at_f: 250
        params: {dur_f: 60, stagger_f: 2, ease: expoIn, direction: retract}
      - move: scaleIn
