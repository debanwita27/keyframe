  - n: 2
    t: [26.37, 29.00]
    frames: [791, 869]
    layout: full-bleed-ui
    content: >
      The one genuinely "hot" (fast) shot in the film, matching the analyzer's velocity
      read. The dense phone-deck cluster from shot 1 flies apart into an evenly spaced
      arc/wave of small dark phone mockups across a plain white background, and the bold
