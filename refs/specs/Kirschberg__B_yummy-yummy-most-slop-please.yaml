id: Kirschberg__B_yummy-yummy-most-slop-please
source: https://x.com/Kirschberg_/status/yummy-yummy-most-slop-please
category: launch-video
product_type: visual-product

format:
  aspect: "16:9"
  fps: 30
  duration_s: 53.067
  orientation: horizontal

verdict: >
  A 53s launch film for "Fastlane" (usefastlane.ai) that stages the whole pitch as one
  agent conversation: a Claude-branded orbit visualization contracts into a chat bullet,
  the user types one prompt, and every proof point (accounts multiplying, global reach,
  a content calendar, a 100x output counter) plays out as the agent's own status updates
  and generated artifacts rather than as narrated slides.

palette:
  bg: "#F5F1EE"
  ink: "#1C1418"
  accent: "#C81E2E"
  support: ["#F0D8D8", "#2A0A10"]
  notes: >
    Off-white/cream with a pulsing pink radial haze dominates roughly 70% of runtime.
    The accent red is rationed to exactly two set pieces - the single glowing send-dot
    at frame ~310 and the deep maroon backdrop behind the multiplying phone mockups
    (f570-869) - then never reappears. Phone screens themselves stay true black (OLED
    mockup convention), never off-black.

typography:
  family_look: serif display
  weights: [regular, bold]
  case: sentence
  tracking: normal
  headline_frame_share: 0.34
  notes: >
    Headlines ("Good afternoon, Zach", "Introducing Fastlane", "Time to fill up your
    Fastlane calendar") set in a serif display face, single line, sentence case. All
    UI chrome (chat input, checklist, calendar, status line) uses a separate small
    geometric sans, kept strictly smaller than the headline tier - a two-family system
    the vocab doesn't usually call for but is deliberate here (headline = brand voice,
    UI = product chrome).

structure:
  - act: hook
    t: [0.0, 3.6]
    purpose: brand title card establishes "Claude for Social Media" before any product is shown
    shots: [1]
  - act: capability
    t: [3.6, 12.3]
    purpose: >
      abstract orbit-of-accounts visualization contracts to a single dot, match-cutting
      into a live chat UI where the user types the one prompt that drives the whole film
    shots: [1]
  - act: proof
    t: [12.3, 26.3]
    purpose: agent narrates its own progress (thinking, connecting, provisioning) while phone mockups physically multiply on screen
    shots: [1]
  - act: reveal
    t: [26.3, 29.0]
    purpose: the multiplying phones scatter into an arc and the brand name "Fastlane" lands
    shots: [2]
  - act: capability
    t: [29.0, 44.3]
    purpose: three rapid-fire proof beats - global reach (globe), quality guardrails (checklist), scheduling (calendar filling with posts)
    shots: [3]
  - act: proof
    t: [44.3, 51.6]
    purpose: a 1x-to-100x output counter lands on a real phone mockup with a stacked notification feed, selling volume concretely
    shots: [3]
  - act: cta
    t: [51.6, 53.1]
    purpose: fade to black, wordmark hold
    shots: [3]

shots:
  - n: 1
    t: [0.00, 26.33]
    frames: [0, 790]
    layout: centre-stack
    content: >
      One continuous take, no internal hard cuts (analyzer confirms "subtle" energy,
      ease-in build with an overshoot/settle bounce). Frame 0-95: "Presenting Claude for
      Social Media" wordmark + rounded-square asterisk icon slides/reveals into frame,
      holds, then the text dissolves away leaving only the icon. Frame 95-310: the icon
      erupts into a radial burst of ~24 small avatar/account nodes on connector lines
      (an orbit-of-accounts motif), holds at full bloom, then retracts back down through
      the icon into a single glowing red dot. Frame 310-360: the dot match-cuts into a
      small red bullet beside the greeting "Good afternoon, Zach" above a chat input bar.
      Frame 360-450: the input types itself out - "Make me 1000 TikTok and Instagram
      accounts for Cal AI" - then submits. Frame 450-570: a single status line beneath
      the submitted prompt cycles through "thinking...", "Connecting to Fastlane", "Drivers,
      start your engines!" (this exact span is where the analyzer's frozen-stretch list
      flags two static holds, 507-523 and 539-549 - the two status-line dwells). Frame
      570-790: dark phone mockups (each showing a generated creator profile - name, bio,
      stats) begin dropping onto a deep maroon backdrop one at a time, at a raked 3D
      angle, fanning into a growing overlapping deck as more arrive.
    moves:
      - move: maskWipeSide
        target: title_lockup
        at_f: 0
        params: {dur_f: 20, dir: r-to-l, ease: expoInOut}
      - move: dissolveBlur
        target: title_wordmark_text
        at_f: 70
        params: {blur_px: [0, 14], opacity: [1, 0], dur_f: 20, note: "icon persists after text clears"}
      - move: radialNodeBurst
