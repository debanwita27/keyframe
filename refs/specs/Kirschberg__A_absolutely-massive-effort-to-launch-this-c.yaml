techniques:
  - id: crack-glow-preshatter-reveal
    what: >
      Before an object physically breaks, thin crack lines spread across its surface and
      brighten from within — the cracks are a shape-driven mask over a bright glow layer,
      not the fracture geometry itself, so the reveal reads as "light escaping" a beat
      before the object's shell actually separates.
    where: shot 1 (frames 60-97, capsule) and shot 13 (frames 953-969, loot crate lid)
    why_it_reads: >
      Separating the mask reveal (light through cracks) from the physical break (shell
      fragments flying apart) gives two readable beats instead of one instant pop, so the
      payoff feels earned rather than abrupt.
    remotion_recipe: >
      Author a static SVG of 6-10 jagged crack-line paths over the object's silhouette. Use
      each path as a `mask` element (stroke, no fill) composited over a bright radial-
      gradient div; animate stroke-width and a Gaussian `feGaussianBlur` stdDeviation on the
      mask from near-zero to a few px so the cracks bloom into visible bright seams. Cut to
      the real fracture (separate rigid fragments, see shatter-burst below) once mask opacity
      hits 1.
    difficulty: moderate

  - id: shatter-burst
    what: >
      At the sharpest motion spike in the whole video (frame 88, magnitude 58.3 of a 76.6
      peak) the object's shell separates into ~24 rigid fragments that fly outward with a
      single white flash frame at the moment of separation.
    where: shot 1, frame 88
    why_it_reads: >
      The flash masks the exact frame where continuity would otherwise look broken (fragment
      positions jumping from "whole" to "in pieces"), the classic trick for hiding a hard
      state change inside a bright pop.
    remotion_recipe: >
      Pre-author N fragment meshes/sprites arranged to reassemble into the whole object at
      t=0. Interpolate each fragment's translate/rotate outward along its own radial vector
      with `expoOut`, staggered by fragment index. Composite a solid white div at opacity
      0→1→0 over exactly 2-3 frames centred on the separation frame so the pop covers the
      state discontinuity.
    difficulty: moderate

  - id: bar-to-wordmark-morph
    what: >
      A single glowing vertical bar (visually reads as a capital "I") widens and splits into
      the full wordmark "BIG" — a shape morph from one simple form into three letterforms,
      not a mask reveal of pre-existing type.
    where: shot 4, frames 313-330
    why_it_reads: >
      Starting from a shape simpler than the destination type gives the eye one clear thing
      to track (a bar) before the payoff (a word), instead of the word simply fading up.
    remotion_recipe: >
      Two SVG paths sharing the same point count: a tall rectangle and the compound path of
      "BIG" set in the display face. Interpolate the `d` attribute between them with a path-
      morphing library (flubber or manual point interpolation) over 18f with `expoOut`; drive
      a screen-space bloom filter on the same shape so the mid-morph frames still read as
      "glowing," masking any interim-shape ugliness.
    difficulty: hard

  - id: logo-glyph-portal-mask
    what: >
      The camera pushes toward a bold brand glyph (Logitech's "G") until the glyph's stroke
      fills the entire frame; the glyph's negative space is used as a hard-edged mask so the
      push itself functions as the wipe into the next scene, rather than a cut.
    where: shot 10, frames 637-673 (and the SteelSeries "S" equivalent in shot 7)
    why_it_reads: >
      A shape-mask transition where the mask is the brand mark itself makes the logo do
      double duty as content and as edit punctuation — the mark is remembered because the
      video was built out of it, not just labelled with it.
    remotion_recipe: >
      Render the glyph as a large SVG `clipPath` applied to the outgoing composition's
      wrapper. Scale the glyph's viewBox transform from 1x to ~40x over 36f with `expoInOut`
      so its stroke edges sweep past frame edges; crossfade the incoming scene's opacity
      0→1 only in the final 6f once the glyph fully covers the frame, so the cut is hidden
      inside the mask's own motion.
    difficulty: hard

  - id: irregular-counter-with-camera-zoom-climax
    what: >
      A metric ("orb count") climbs in 20 irregular discrete jumps from 261 to 998 across
      ~145 frames while the camera continuously dollies in, so the counter's final digits
      arrive exactly as the word "ORBS" fills the frame.
    where: shot 11, frames 683-828
    why_it_reads: >
      Tying the camera's climax (max zoom) to the counter's climax (near-max value) makes
      two independent parameters feel like one causal event — "the number going up is what's
      pulling the camera in."
    remotion_recipe: >
      Drive both the counter's displayed value and the camera's dolly scale off the same
      shared progress value p (0-1) rather than independent timers: counter snaps between
      the keyed value array at p-derived checkpoints, `scale = interp(p, [0,1], [1,3.2])`
      with `expoInOut`. This is the same "drive ambient/hero motion off one progress value"
      principle as byshubh's radial-glow technique, applied to a camera move instead of a glow.
    difficulty: moderate

  - id: orb-to-parachute-crate-transform
    what: >
      Falling orb icons from the previous shot are the same objects that become the loot
      crates in this shot — no new elements are introduced, they scale/reshape from sphere
      to cube-with-canopy across the cut.
    where: shots 11→12 boundary, frames 828-852
    why_it_reads: >
      Reusing the exact object across a scene change (an implicit match cut on the object's
      identity, not just its silhouette) sells "these orbs are the reward" without a caption.
    remotion_recipe: >
      Keep the same particle-system instance IDs across both shots; interpolate each
      instance's geometry (sphere→rounded-cube) and add a parachute-canopy child mesh whose
      scale animates 0→1 with `backOut` once the cube shape is reached, rather than
      destroying and re-spawning new elements.
    difficulty: needs-3d

rhythm:
  cut_count: 15
  median_shot_f: 108
  fastest_f: 8
  slowest_f: 202
  pattern: >
    Ten distinct registers in 44.7s, each running roughly 2-6s before a hard content pivot
    (new object, new brand, new UI): orb-charge hook (3.2s) -> debris/mascot reveal (7.2s)
    -> BIG flash-cut impact (3.5s) -> Xbox Game Pass proof (5.4s) -> SteelSeries cameo (1.3s)
    -> Logitech G cameo (1.5s) -> orb-counter/zoom climax (4.8s) -> parachute-crate drop
    (4.1s) -> Discord-UI social proof (3.9s) -> Nitro endcard hold (6.7s). The two sharpest
    motion-curve peaks (the frame-88 shatter and the frame-762-873 zoom-to-ORBS stretch) sit
    at roughly 2% and 60-65% of runtime, matching the "peaks cluster near 70%, then a long
    held end card" energy-curve law even without a fixed beat grid.
  beat_grid_f: 0
  energy_curve: wave

transferable:
  - >
    To compress this to 25-30s: cut shot 6's screen-recorded gameplay trailer footage
    (frames ~460-580, ~4s) entirely — it is unstyled B-roll and the lowest craft-per-second
    stretch in the video; keep only the boxart-cards-into-GAME-PASS-wordmark beat (~1.5s).
  - >
    Merge the SteelSeries (shot 7-9) and Logitech G (shot 10) cameos into one ~2s combined
    "accessory partners" beat — two sequential single-brand product shots read as repetition
    at this length; one shot with both logos orbiting together reads as one idea, not two.
  - >
    Cut shot 15's "SAME SAME SAME"/GG social-proof beat if time-constrained — it repeats the
    "here's the Discord UI" idea already established in shot 14 without adding a new
    mechanic, whereas every other shot introduces a new object or new information.
  - >
    Trim the final hold (shot 16, 6.7s) to ~3s — two headline swaps plus legal fine print is
    more than a 25-30s spot needs; keep the debris-burst-into-wordmark entrance and cut
    straight to the final "Discord NITRO" lockup without the intermediate "MAX OUT YOUR GAME" card.
  - >
    Drive a camera's climax off the same progress value as a counter's climax (see
    irregular-counter-with-camera-zoom-climax) instead of hand-timing two separate curves —
    it's cheaper to build and reads as more intentional.
  - >
    Reuse one object's mesh/particle instance across a scene boundary (orb-to-crate) instead
    of a cut to new elements — the strongest "no-cut" transitions in this piece are all
    object transforms, not composited wipes.

avoid:
  - >
    Hand-keyframing 24 shatter fragments' individual trajectories in After Effects; use a
    radial-vector formula (angle = index/count * 360, distance = f(frame)) driven by a
    single progress value so the burst is parametric and reusable at any fragment count.
  - >
    Rotoscoping or manually painting the crack-line glow; author the cracks as one static
    SVG path set and drive stroke/blur opacity from a single value — see crack-glow-preshatter-reveal.
  - >
    Licensing/using real game-trailer screen-recordings as filler (shot 6's Grounded/
    Stardew clips) in a from-scratch spot; substitute a synthetic UI showing the product's
    own screen states, animated on state changes per Principle 10's visual-product guidance.
  - >
    Attempting the path-morph from bar to "BIG" wordmark by hand-tweening points frame by
    frame; use a path-interpolation library so the point correspondence and easing are
    computed once, not re-keyed per letterform.

new_moves:
  - name: crackGlowReveal
    params: {crack_opacity: [0, 1], glow_intensity: [0.1, 1.0], dur_f: 16-27, ease: expoIn}
    description: >
      A shape-driven mask reveal where a static set of crack-line SVG paths is used as a
      mask/stroke over a bright glow layer; the mask's opacity and the glow's intensity
      animate together so light appears to escape through the cracks before the surface
      physically breaks. Used once per "something is about to unlock" beat.
  - name: shatterBurst
    params: {flash_opacity: [0, 1, 0], fragment_count: 12-24, dur_f: 6-10, ease: expoOut}
    description: >
      A rigid object separates into N fragments that fly outward along radial vectors from
      the object's centre, staggered by fragment index, with a 2-3f solid-colour flash
      composited at the exact separation frame to hide the whole/fragmented state jump.
  - name: barToWordmarkMorph
    params: {dur_f: 18, source_shape: vertical_bar, ease: expoOut}
    description: >
      An SVG path morphs from a simple placeholder shape (a bar, a dot) into a compound
      wordmark path with matching point count, via path interpolation, so a headline
      resolves out of an ambiguous shape rather than fading up as static type.
  - name: logoGlyphPortalMask
    params: {scale: [1, 40], dur_f: 30-36, ease: expoInOut}
    description: >
      A brand glyph is used as a clip-path mask on the outgoing scene; scaling the glyph
      up until its stroke fills the frame functions as a wipe transition into the next
      scene, crossfaded in only during the final few frames once the mask is full-bleed.
  - name: toggleStateCycle
    params: {states: 3, hold_per_state_f: 18, dur_f: 55, ease: springSnap}
    description: >
      A UI toggle prop flips between more than two visual states (off/dark, on/white,
      on/accent-colour) inline within an otherwise-continuous ambient shot, each state
      held briefly with a spring settle, to demonstrate a feature without a dedicated shot.
  - name: wordSwapCrossfadeMorph
    params: {dur_f: 14, ease: expoInOut}
    description: >
      One headline's full text is replaced by a different full string in place, via a
      per-character or per-line cross-fade/mask, keeping layout and type size identical so
      the swap reads as one sign changing its message rather than a new card.

convergence:
  - >
    counterUp with a keyframed-jump value array driving a metric upward in irregular steps —
    matches byshubh's continuous-live-counter technique almost exactly, just applied to an
    orb-reward count instead of a revenue figure.
  - >
    A bright flash/specular pop used to mask a hard state discontinuity (shatterBurst here,
    specular-flash-outro-loop in byshubh) — same underlying trick, different geometry.
  - >
    dropShadowSoft on floating UI panels (the tablet live-stream, the Discord laptop screen)
    matches byshubh's treatment-layer usage on floating cards.
  - >
    Driving two independent parameters (camera scale, counter value) off one shared progress
    value instead of two timers — the same pattern as byshubh's radial-glow-tied-to-content-
    progress technique.
  - >
    staggerRise for debris/icon entrances is the same move byshubh uses for stat-card
    entrances, just applied to loose particle props instead of UI cards.

detection_notes: >
  Raw cut-detector found 40 shot boundaries; several are false positives from motion-blur/
  flash spikes inside one continuous beat, merged here: frames 89-97 (table shots 2-3) are
  the shatter-burst climax of shot 1, not separate cuts. Frames 165-172 (shots 5-6) are the
  toggle-switch colour-pop inside shot 3, not cuts. Frames 313-320 (shots 8-9) are one
  flash-cut transition into the BIG card, counted as a single transition. Frames 349-419
  (shots 11-12, 14-18) are the BIG-card hold and its whip-pan exit, merged into shots 4-5.
  Frames 629-636 (shots 22-23) are one flash transition between the SteelSeries and Logitech
  cameos. Frames 747-828 (shots 26-27, 29-31) are motion-blur spikes from individual falling
  orb icons passing close to camera during the continuous zoom of shot 11, not cuts. Frames
  866-873 (shots 33-34) are inside the orb-to-crate transform of shot 12. Frame 1019-1022
  (shot 37) is the flash transition into shot 14. Net effect: 40 detected boundaries collapse
  to 15 real cuts across 16 shots.
