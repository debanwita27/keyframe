verdict: >
  A 44.7s Discord Nitro rewards campaign spot that never lets one visual idea run past
  roughly five seconds: a charging orb cracks open, debris resolves into a wordmark, a
  tumbling card-stack sells partner logos, a live counter races while the camera zooms
  into it, and a parachuting loot-crate literally delivers the "Unlock with Nitro" CTA.
  The throughline is objects that transform into the next object rather than cutting to it.

palette:
  bg: "#000018"
  ink: "#F4F0FA"
  accent: "#7830C0"
  support: ["#300048", "#180030", "#600060", "#78C0F0", "#90E0C0"]
  notes: >
    Near-black space background throughout (#000018/#180018) with a magenta-to-purple
    nebula glow (#300048/#600060/#7830C0) behind every scene. Brand-partner segments
    (Xbox green, SteelSeries white/pink, Logitech G white/magenta) each get one saturated
    accent swap against the same dark base, functioning as the "invert once per shot"
    colour beat rather than a single global accent.

typography:
  family_look: grotesk
  weights: [bold, black]
  case: upper
  tracking: tight
  headline_frame_share: 0.55
  notes: >
    Headline cards ("BIG", "NEW WAYS TO GET ORBS", "MAX OUT YOUR GAME", "Discord NITRO")
    run 1-4 words, always upper/mixed-case bold, set very large against the debris field.
    UI copy (Discord chat, tooltip, game titles) stays small and functional by contrast.

