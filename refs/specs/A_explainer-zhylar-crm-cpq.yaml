techniques:
  - id: word-cycle-slot-settle
    what: >
      Three independent text columns, each cycling through 2-3 candidate words
      at a fast fixed rate, staggered so column 1 settles first, then column 2,
      then column 3 — like a slot machine landing left to right. The final held
      frame reads as one deliberate sentence ("bank / revolutionary / Simplify
      Processes") even though each word arrived by elimination, not by writing.
    where: shot 4, frames 175-212
    why_it_reads: >
      The eye reads rapid word substitution as "the computer/system deciding,"
      which sells "processes optimised for you" without needing a real
      personalisation engine. It also disguises a plain 3-word headline as a
      whole sequence of content.
    remotion_recipe: >
      Three absolutely-positioned <div> columns. Each column holds an array of
      candidate strings, e.g. col1=["breaking","bank"], col2=["","With","our","revolutionary"],
      col3=["Simplify Proce","Simplify Process","Simplify Processes"]. Drive each
      column's visible index with Math.floor(frame / swapEveryF) clamped to
      array.length-1, so it swaps every ~5 frames and locks on the last entry.
      Stagger each column's start frame by settle_stagger_f (5f) so they don't
      all land in the same frame. Crossfade each swap with opacity 0->1 over 2-3f
      (interpolate) rather than a hard cut, to avoid strobing. No AE needed —
      pure array-index-by-frame logic.
    difficulty: trivial

  - id: word-build-suffix-reveal
    what: >
      A headline grows by appending letters over 4 discrete steps ("Simplify
      Pro" -> "...Proces" -> "...Processe" -> "...Processes"), with an
      underline/box beneath that redraws its width to match the new text length
      on every step.
    where: shot 14, frames 475-497 (visually distinct from the word-cycle above — this
      one only ever grows, never substitutes)
    why_it_reads: >
      Reads as the sentence "being completed live," giving weight to a single
      short tagline by spending 22 frames on it instead of 6.
    remotion_recipe: >
      Define the full string once ("Simplify Processes") and a steps array of
      substring lengths [12, 15, 17, 19] (i.e. "Simplify Pro".length, etc).
      currentStep = Math.floor((frame - startF) / durPerStepF); render
      fullString.slice(0, steps[currentStep]). Measure the rendered text width
      each step (ref.offsetWidth or a canvas measureText precompute) and animate
      the underline <div> width to that value with a spring/expoOut over the
      same durPerStepF window so the line "catches up" to the new text.
    difficulty: moderate

  - id: toast-confirmation-pop
    what: >
      A pill-shaped toast ("Quote Sent Successfully!", "Email Sent!") pops in
      with overshoot, sits on a saturated green fill (the only non-purple hue
      in the whole video) with a soft outer glow, holds ~15-20f, then blur-fades out.
    where: shots 6 and 9, frames 246-271 and 324-373
    why_it_reads: >
      Breaking the palette rule exactly for success states makes "it worked"
      register instantly and only twice — scarcity keeps it meaningful.
    remotion_recipe: >
      <div> with border-radius:999px, background: saturated green, box-shadow:
      0 0 24px rgba(green,0.5) for the glow (equivalent to bloomGlow treatment).
      Enter with spring({damping:14, mass:0.5, stiffness:180}) driving scale
      0->1.08->1 (springSnap / popIn). Hold via a flat frame range, then exit
      with blur(0->14px) + opacity(1->0) over 12f (dissolveBlur) — filter:blur()
      is GPU-cheap, no AE needed.
    difficulty: trivial

  - id: raked-3d-ui-card-flatten
    what: >
      A UI mockup (invoice form, email compose card) enters tilted in shallow 3D
      perspective as if being laid flat on a table, then rotates to face-on over
      ~20f while its internal fields stagger-fill.
    where: shots 5 and 7, frames 213-245 and 272-306
    why_it_reads: >
      Gives a flat screenshot a sense of physical placement/arrival instead of
      just fading in, and buys time to stagger-reveal form fields believably.
    remotion_recipe: >
      Wrap the UI card in a container with CSS perspective: 1000px. Animate the
      card's transform: rotateY() and rotateX() from ~20deg/8deg down to 0 using
      an expoInOut/expoOut interpolation over 20f (orbit3D). Keep transform-origin
      at the card's bottom edge so it reads as "being set down." Stagger the
      internal form rows/fields with a separate staggerRise (y 16->0, 3f stagger)
      starting a few frames after the tilt begins.
    difficulty: moderate

rhythm:
  cut_count: 19
  median_shot_f: 33
  fastest_f: 17
  slowest_f: 71
  pattern: >
    78f cold-open hook -> two ~4f flash-punches (merged into neighbours) -> a
    string of 17-50f UI/illustration beats depicting one continuous CPQ user
    story (dashboard -> quote -> invoice -> email -> persona proof -> tagline
    payoff) -> 52f logo/skyline outro hold. Energy is front- and back-loaded
    (fastest cuts at the open and around the two toast pops); the middle two
    thirds run at a steady "medium" energy with no shot under 17f once flashes
    are excluded.
  beat_grid_f: null
  energy_curve: wave

transferable:
  - Steal the 3-column word-cycle slot machine (technique word-cycle-slot-settle)
    for any single-line value-prop headline — it's 3 arrays and a frame-based
    index, zero keyframing.
  - Steal the suffix-growing headline with a redrawing underline (technique
    word-build-suffix-reveal) whenever a tagline needs to feel "typed to
    completion" rather than typed character by character.
  - Reserve one saturated off-palette colour (here, green) exclusively for
    success toasts so it reads as a distinct "system state," not a design choice.
  - Use raked-3D-then-flatten (perspective + rotateY/X to 0) as the default
    entrance for any UI-mockup card instead of a flat fade/scale-in.
  - Every persona/proof beat swaps only three things — a chip label, the
    illustration, and 1-2 flanking icons — reuse that 3-part template for any
    "who this is for" sequence instead of designing bespoke scenes per persona.

avoid:
  - The Storyset-style illustrated characters (presenter portrait, handshake
    pair, storefront, skyline) are pre-made vector assets, not something to
    hand-animate a rig for. Buy/license static SVGs and only animate them with
    generic transforms (staggerRise, scaleIn, breathe) — never attempt custom
    limb/joint keyframing.
  - The icon-orbit formation in shot 1 (icons flying to precise ring positions
    with individual overshoot) looks hand-tweaked per icon in AE. Substitute
    with polar-coordinate placement (x = r*cos(theta), y = r*sin(theta)) driven
    by a single spring per icon, staggered — never hand-key each icon's arc.
  - The building-skyline "mis-rotated then corrects" outro (shot 15) reads like
    manually nudged rotation keyframes per building. Substitute — give each
    building a random initial rotate/offset seeded by its index, and let one
    shared spring() config resolve them all to 0 with a per-index delay —
    consistent physics, no manual correction pass.
  - The two 4-6f "flash" shots the cut-detector counted as their own shots
    (frames 78-81, 125-128, 213-218) are not real content beats — don't budget
    a full shot's worth of design/timing effort on a transition punch; they're
    a flashCut treatment layer, not a scene.

new_moves:
  - name: wordCycleSettle
    params: {cycle_words_per_col: 3, swap_every_f: 5, settle_stagger_f: 5, ease: expoOut}
    description: >
      For N independent text columns/slots, cycle each through its own array of
      candidate strings at a fixed swap rate (swap_every_f), crossfading each
      swap over 2-3f. Stagger each column's final settle frame by
      settle_stagger_f so columns lock left-to-right (or in a defined order)
      rather than all at once. Reads as a slot machine converging on a decided
      sentence. Good for single-line value props assembled from independent
      word slots (subject / adjective / value-prop-phrase).
  - name: wordBuildReveal
    params: {steps: 4, dur_per_step_f: 5, ease: expoOut, underline_draw: true}
    description: >
      A single string is revealed by progressively increasing the visible
      substring length in N discrete steps (never per-character or all at
      once). If underline_draw is true, an underline/box beneath the text
      animates its width to match the new substring's measured width on each
      step. Distinct from typeOn (which is continuous, per-character, with a
      caret) and from letterCascade (which animates already-complete text) —
      this move is for a short tagline that should feel "completed via a few
      deliberate edits."

