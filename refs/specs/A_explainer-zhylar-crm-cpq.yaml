id: A_explainer-zhylar-crm-cpq
source: local-reference (A_explainer-zhylar-crm-cpq.mp4)
category: saas-explainer
product_type: visual-product

format:
  aspect: "16:9"
  fps: 30
  duration_s: 19.966
  orientation: horizontal

verdict: >
  A stock-illustration SaaS explainer that hides its budget behind three cheap,
  code-native tricks: a 3-column word-cycle slot machine that lands on the value
  prop, a suffix-growing headline ("Simplify Pro" -> "Simplify Processes") with a
  drawn underline, and toast notifications with a green glow that sell "it worked."
  Everything else is Storyset-style vector illustration panning/scaling, which is
  cheap to buy but expensive to hand-animate — don't rebuild the character rigs.

palette:
  bg: "#F0F0F0"
  ink: "#180048"
  accent: "#7860C8"
  support: ["#F0D8F0", "#D8D8F0", "#A890D8", "#C0A8F0", "#300060"]
  notes: >
    Light-dominant lavender/white UI chrome (F0F0F0, F0D8F0, D8D8F0) against deep
    plum ink (#180048) for headlines and dark navy-purple (#300060) for the
    cold-open card background. Accent purple (~#7860C8, interpolated — not in the
    top-7 swatch list but visible on every button/header/circle) is rationed to
    interactive elements: dashboard header bar, CTA buttons, wordmark circle, icon
    chips. Success states break the palette entirely with a saturated green toast
    (#3ECF6E-ish) — the only non-purple hue in the whole video, used exactly twice.

typography:
  family_look: geometric sans
  weights: [medium, bold]
  case: sentence
  tracking: normal
  headline_frame_share: 0.35
  notes: >
    Headlines are short sentence-case fragments (2-6 words), never full sentences,
    assembled progressively rather than typed. UI mockup text is a smaller
    geometric sans at ~11-14px equivalent. The wordmark "Zhylar" is a rounded serif
    (distinct from body sans) always paired with a tracked-out uppercase tagline
    "ACE DIGITALLY" underneath at ~40% the wordmark's size.

structure:
  - act: hook
    t: [0.00, 2.73]
    purpose: Name the target persona and assemble the brand mark from feature icons.
    shots: [1]
  - act: capability
    t: [2.73, 7.07]
    purpose: Tour the dashboard UI, then land the core value-prop sentence via a word-cycle reveal.
    shots: [2, 3, 4]
  - act: capability
    t: [7.07, 12.47]
    purpose: Walk the CPQ flow end to end — quote built and sent, email sent.
    shots: [5, 6, 7, 8, 9]
  - act: proof
    t: [12.47, 15.83]
    purpose: Show who it's for (SMEs, managers, sales people) closing real deals.
    shots: [10, 11, 12, 13]
  - act: capability
    t: [15.83, 18.20]
    purpose: Build the tagline word-by-suffix, then show the reporting payoff (quotes archive, analytics, risk flags caught).
    shots: [14]
  - act: cta
    t: [18.20, 19.97]
    purpose: Logo lockup over a growing skyline — "you'll grow" as a literal building animation.
    shots: [15]

