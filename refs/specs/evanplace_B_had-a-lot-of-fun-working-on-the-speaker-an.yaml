id: evanplace_B_had-a-lot-of-fun-working-on-the-speaker-an
source: "unknown (X/Twitter post by @evanplace; folder name preserves the original post's caption text)"
category: kinetic-type
product_type: brand-only

format:
  aspect: "16:9"
  fps: 29.97
  duration_s: 19.987
  orientation: horizontal

verdict: >
  Three small flat-design vignette icons build from a shared kit of primitives
  (bars, semicircles, quarter-circle "petals"), hold, then dissolve back down
  to a single point before the next one builds from that same point -- until
  the third icon's orange accent shape scales up as a match cut into a
  full-bleed title card that reveals "MATTHEW ENCINA & CHRIS DO" and holds for
  6.7 seconds. The reusable idea is a repeatable build/hold/collapse-to-point
  cycle that strings unrelated illustrations together without a single hard
  cut.

detection_notes: >
  profile.md's shot detector reports a single shot (0-598f, no luma-delta cut
  above 26.0) across the whole 599-frame, 20-second piece -- zero hard cuts.
  The six shots below are a narrative subdivision of one continuous take,
  matching the precedent set by B_chromatic-logo-2d3d.yaml. The frozen-stretch
  list independently anchors these boundaries: 0-16 is the empty establishing
  beat before the first primitive fades in; 69-88 falls inside the first
  icon's hold; 178-202 falls inside the second icon's long hold; 267-321
  falls inside the third icon's hold; 421-598 is the closing title-card hold
  (5.91s, the longest frozen stretch in the piece by a wide margin). Sheets 2
  and 3 additionally show, and confirm by direct inspection, that each icon
  collapses to a single floating dot (frames ~107-122 and ~217-237) before the
  next icon's primitives begin arriving from that same dot -- this is a real,
  repeated construction/deconstruction cycle, not cut-detector noise.

palette:
  bg: "#90A8A8"
  ink: "#184848"
  accent: "#F06030"
  support: ["#D8D8C0", "#A8C0C0", "#304848", "#484848"]
  notes: >
    A flat sage-teal background (60% screen share) hosts dark-teal
    "structure" primitives (buildings, bars, pillars) with a single orange
    accent shape (14.7% share -- a sun/circle) reused across all three
    vignette icons and then scaled up to become the title card's dominant
    background shape. Cream and mid-teal tones round out the corner shapes
    on the final title card. The accent color is deliberately the one
    element that survives the match-cut into the closing card.

typography:
  family_look: "grotesk"
  weights: [bold]
  case: upper
  tracking: tight
  headline_frame_share: 0.38
  notes: >
    Only text in the piece is the closing title card: "MATTHEW / ENCINA / &
    CHRIS DO" set across three stacked lines, bold uppercase grotesk, white
    on the orange title-card shape, tight tracking. No text appears during
    any of the three icon-construction beats.

structure:
  - act: hook
    t: [0.00, 1.07]
    purpose: establish an empty frame with one translucent seed shape fading in, before any construction begins.
    shots: [1]
  - act: capability
    t: [1.07, 4.07]
    purpose: build the first small flat-design vignette icon from primitives, hold it, then collapse it back to a single point.
    shots: [2]
  - act: capability
    t: [4.07, 7.91]
    purpose: build a second, more complex vignette icon (a building facade) from primitives, hold it longer, then collapse it.
    shots: [3]
  - act: proof
    t: [7.91, 12.07]
    purpose: build a third vignette icon, hold it, then scale its orange accent shape up as a match cut into the closing title card's background.
    shots: [4]
  - act: cta
    t: [12.07, 19.99]
    purpose: reveal the "MATTHEW ENCINA & CHRIS DO" title card and hold it for an unusually long, confident close.
    shots: [5, 6]

shots:
