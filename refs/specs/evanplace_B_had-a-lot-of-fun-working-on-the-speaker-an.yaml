    moves:
      - move: breathe
        target: titleCard
        at_f: 0
        params: {scale: "1->1.008->1", period_f: 180}
    camera: {move: static, params: {}}
    bg: {kind: flat, moves: []}
    treatment: []
    audio_cue: none
    transition_out: {move: hardCut, params: {dur_f: 0}}
    hold_f: 30

techniques:
  - id: primitive-by-primitive-icon-assembly
    what: >
      Each of the three small vignette icons is built from a shared vocabulary
      of primitives (rectangle bars/pillars, semicircles, quarter-circle
      "petals," circles) that pop in one at a time roughly every 4-5f, in an
      order that reads base-first (platform/ground), then structure
      (pillars/arches), then accent (the orange color pops arrive last).
    where: shots 2-4, frames 32-362
    why_it_reads: >
      A consistent kit-of-parts and consistent stagger across three visually
      unrelated icons makes the whole piece feel like one system rather than
      three different illustrations, even though the content changes each
      time.
    remotion_recipe: >
      Define each icon as an ordered array of {shape, props, arrive_f}
      entries. Render each primitive with popIn (scale 0.7->1, opacity 0->1,
      dur_f~10, backOut) staggered ~4-5f apart in array order. Group all of
      one icon's primitives under a single parent so the whole icon can later
      be scaled/faded as one unit for the collapse.
    difficulty: trivial

  - id: collapse-to-a-point-rebuild-cycle
    what: >
      A fully-built icon shrinks/fades in unison down to a single floating
      dot before the next icon's primitives arrive from that same dot --
      repeated twice in this piece (frames ~107-122 and ~217-237).
    where: shots 2-3 boundaries
    why_it_reads: >
      The surviving dot gives the eye one continuous element to track across
      what would otherwise be an unmotivated scene change, so three unrelated
      illustrations never feel like three separate hard cuts.
    remotion_recipe: >
      At the collapse frame, animate the icon's primitive-group opacity/scale
      down together (scaleOut-like, dur_f~15, expoIn) while one already-
      present small circle primitive holds scale 1 and drifts slightly (e.g.
      y+20px); that same dot becomes the first primitive in the next icon's
      staggered arrival array, so the collapse and the next build share one
      continuous element and no true cut ever happens.
    difficulty: moderate

  - id: accent-shape-scale-match-cut
    what: >
      The small orange "sun" shape inside the third vignette icon scales up
      by roughly an order of magnitude and repositions to become the giant
      background shape of the closing title card, while sibling shapes
      (teal dome, corner wedges) resize into their final full-frame layout on
      the same timing.
    where: shot 4, frames ~337-362
    why_it_reads: >
      Keeping one element persistent and simply scaling/repositioning it
      turns what could have been a jarring scene change (small illustration
      to full-bleed title card) into the single strongest transition in the
      piece.
    remotion_recipe: >
      Keep the "sun" shape as one persistent element across the transition --
      never swap assets. Interpolate its transform-origin-anchored scale from
      ~1x to ~14x and its position from the vignette's local coordinates to
      the title card's final coordinates over ~25f with expoInOut; animate
      the sibling background shapes into their final positions on the
      identical timing so everything lands on the same frame.
    difficulty: moderate

  - id: long-dwell-title-card-close
    what: >
      A bold white three-line uppercase title reveals via a brief mask wipe
      (~35f) then holds completely static for ~201 frames (6.7s).
    where: shots 5-6, frames 362-598
    why_it_reads: >
      An intentionally long, confident final hold (well beyond the usual
      6-10f settle-and-cut rule) reads correctly here because this is a
      closing/end card, not a mid-video beat -- the eye is meant to sit with
      the credit, not move past it.
    remotion_recipe: >
      Standard maskWipeUp per line (3 lines, per_line_stagger_f~4, dur_f~16,
      expoOut) over the matched-cut background shapes; set hold_f to roughly
      200f rather than the default 6-10f because this is the video's final
      frame group.
    difficulty: trivial

rhythm:
  cut_count: 1
  median_shot_f: 102
  fastest_f: 32
  slowest_f: 201
  pattern: >
    32f empty establish -> 90f icon-1 build/hold/collapse -> 115f icon-2
    build/long-hold/collapse -> 125f icon-3 build/hold/match-cut-scale-up ->
    35f title-text reveal -> 201f final title-card hold. Zero hard cuts;
    every icon-to-icon boundary is a collapse-to-a-point-and-rebuild, and the
    final scene change is an accent-shape match cut.
  beat_grid_f: none
  energy_curve: wave

transferable:
  - Build a repeatable kit of shared primitives (bars, semicircles,
    quarter-circle petals) and reuse the exact same stagger/entrance timing
    across multiple different illustrations so a multi-scene piece reads as
    one system.
  - Collapse a completed composition down to a single surviving point before
    building the next one from that same point -- a cheap, morph-driven way
    to link unrelated scenes without a hard cut.
  - When a small accent shape needs to become a full-bleed background later
    in the piece, keep it as the SAME element and scale/reposition it rather
    than cutting to a new asset -- turns a scene change into a match cut for
    free.
  - Reserve one dramatically long hold (here 6.7s, far past the usual 6-10f
    rule) for the true final frame of a piece -- it reads as a confident
    close, not a mistake, precisely because everything before it moved at a
    normal pace.

avoid:
  - Do not procedurally generate the vignette icons -- author each as an
    explicit ordered shape-list exactly like a small hand-built vector
    illustration, then let one generic build/hold/collapse move sequence
    drive all of them; the content authoring is the real cost here, not the
    animation logic.
  - Keep every within-icon primitive stagger at a strict, constant 2-4f per
    the timing law even when the number of primitives differs between icons
    (5 in icon 3, 9 in icon 1) -- an uneven stagger will read as a bug rather
    than a stylistic choice.
  - The 6.7-second final hold only reads as confident because nothing else in
    the piece holds anywhere near that long -- do not apply a similarly long
    hold to a mid-piece beat, it will read as the video having stalled.

new_moves:
  - name: collapseToPoint
    params: {dur_f: 15, ease: expoIn}
    description: >
      A fully-formed group of shapes shrinks/fades in unison down to a
      single point (one surviving primitive scaled to a small dot), which
      then either drifts to seed the next construction or pops back outward
      into a new shape -- used as a soft connective transition between two
      constructed states instead of a hard cut. (Shared definition with
      evanplace_B_a-logo-animation-of-openais-logo.yaml, which layers this
      move underneath its ring/hexagon staging.)
  - name: accentScaleMatchCut
    params: {dur_f: 25, ease: expoInOut}
    description: >
      A small accent shape inside a compact illustration scales up by an
      order of magnitude and repositions to become the full-bleed background
      of the next full-frame layout, while sibling shapes resize/reposition
      into their final places on the same timing -- a matchCut executed as
      one continuous scale/reposition rather than a hard cut.

convergence:
  - >
    The primitive-by-primitive icon assembly technique is convergent with
    B_chromatic's "blueprint-construction-reveal" technique, in which guide
    lines and shading progressively resolve a shape out of raw geometry --
    both force the eye to parse construction before recognizing the result.
  - >
    The collapse-to-a-point-rebuild cycle and the accent-shape scale match
    cut are both convergent with B_chromatic's overarching structural finding
    (detection_notes: "every cut is actually a flash/morph on the same
    continuing object, never a scene change") -- this piece achieves the
    identical effect across three unrelated illustrations rather than one
    persisting mark.
