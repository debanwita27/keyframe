    t: [0.00, 1.07]
    frames: [0, 32]
    layout: centre-stack
    content: >
      Empty flat sage-teal background. A translucent ring outline fades in and
      grows near the top of frame from frame 17 onward (key sheet_01 row1,
      cols 4-6) -- the seed shape the first icon will build from.
    moves:
      - move: unblurIn
        target: seedRing
        at_f: 17
        params: {blur: "10->0", scale: "0.8->1", dur_f: 15, ease: expoOut}
    camera: {move: static, params: {}}
    bg: {kind: flat, moves: []}
    treatment: []
    audio_cue: none
    transition_out: {move: none, params: {note: "seed ring becomes the first primitive of shot 2, no cut"}}
    hold_f: 0

  - n: 2
    t: [1.07, 4.07]
    frames: [32, 122]
    layout: centre-stack
    content: >
      A dark-teal bar/platform slides in (blurred, fast, frame 32), then a
      circle-outline "sun," a green filled semicircle, small rectangular
      pillar/window primitives, a green dome arch, and two orange
      quarter-circle "petal" shapes arrive one at a time roughly every 5f
      (frames 37-62), assembling into a small flat vignette icon (a stylized
      speaker/sun scene). It holds complete through frames 62-107, then every
      primitive shrinks/fades in unison back down to a single floating dot by
      frame 122.
    moves:
      - move: popIn
        target: "icon1 primitives (bar, ring, semicircle, pillars x3, dome, petals x2)"
        at_f: 0
        params: {n: 9, stagger_f: 5, scale: "0.7->1", dur_f: 10, ease: backOut}
      - move: collapseToPoint
        target: icon1
        at_f: 75
        params: {dur_f: 15, ease: expoIn}
    camera: {move: static, params: {}}
    bg: {kind: flat, moves: []}
    treatment: []
    audio_cue: tick
    transition_out: {move: none, params: {note: "the surviving point seeds shot 3, no cut"}}
    hold_f: 6

  - n: 3
    t: [4.07, 7.91]
    frames: [122, 237]
    layout: centre-stack
    content: >
      From the surviving dot, a ground line appears (frame 127), a rounded
      silo/tower base forms (frame 132), roof and flag pieces and repeated
      arched-window shapes arrive in a tight stagger (frames 137-152),
      assembling into a small flat building-facade icon. It holds complete
      for an unusually long stretch (frames 152-217, ~65f), then collapses
      back down to a single point by frame 237, the same way shot 2's icon
      did.
    moves:
      - move: popIn
        target: "icon2 primitives (ground line, silo, roof/flag pieces, arch windows x4-5)"
        at_f: 0
        params: {n: 7, stagger_f: 4, scale: "0.7->1", dur_f: 10, ease: backOut}
      - move: collapseToPoint
        target: icon2
        at_f: 95
        params: {dur_f: 15, ease: expoIn}
    camera: {move: static, params: {}}
    bg: {kind: flat, moves: []}
    treatment: []
    audio_cue: tick
    transition_out: {move: none, params: {note: "the surviving point seeds shot 4, no cut"}}
    hold_f: 6

  - n: 4
    t: [7.91, 12.07]
    frames: [237, 362]
    layout: centre-stack
    content: >
      A bar/platform and arch reassemble (frame 237), an orange "sun" circle
      rises into place alongside a green rectangle accent (frames 242-262),
