    moves:
      - move: scaleIn
        target: browserMockup
        at_f: 0
        params: {scale: [1.3, 1], opacity: [0.6, 1], dur_f: 12, ease: backOut}
      - move: autoScrollReveal
        target: browserMockupContent
        at_f: 0
        params: {dur_f: 12, distance_px: 900, ease: expoInOut}
    camera: {move: pullOut, params: {scale: [1.15, 1], ease: expoInOut}}
    bg: {kind: flat, moves: []}
    treatment: [dropShadowSoft]
    audio_cue: whoosh
    transition_out: {move: matchCut, params: {note: "rounded-rect card silhouette carries into shot 4's phone bezel"}}
    hold_f: 0

  - n: 4
    t: [2.04, 3.54]
    frames: [49, 84]
    layout: centre-stack
    content: >
      A single phone-shaped card (HIDE skin-booster brand) fills most of frame,
      autoscrolling continuously top-to-bottom through one full email: model photo
      applying product → "HIDE / MEMORIAL DAY SAVINGS UP TO 50% OFF" black header →
      "50% off $100+" (yellow-highlighted) / "25% off $50+" copy → "Don't wait any
      longer" CTA → yellow "SHOP NOW" pill button → "Explore our Super Set
      Collection / Maximize coverage, multiply wear" with two product icons. One
      continuous internal scroll, no cuts, matching motion.csv's smooth ramping
      curve across the full 36f (no delta spikes).
    moves:
      - move: autoScrollReveal
        target: phoneCardContent
        at_f: 0
        params: {dur_f: 36, distance_px: 1400, ease: linear}
    camera: {move: null, params: {}}
    bg: {kind: flat, moves: []}
    treatment: [dropShadowSoft]
    audio_cue: none
    transition_out: {move: zoomBlurCut, params: {dur_f: 5}}
    hold_f: 0

  - n: 5
    t: [3.54, 4.54]
    frames: [85, 108]
    layout: grid
    content: >
      BURST 1 (24f, sampled by the detector as 6 sub-cuts of 3-9f each — frames
      85-87, 88-90, 91-99, 100-102, 103-105, 106-108). The single HIDE card breaks
      into a horizontally-sliding row: HIDE's "Don't forget your Foundation Brush!"
