techniques:
  - id: conveyor-matchcut-montage
    what: >
      Every one of the ~12 client projects is rendered inside the same uniform
      rounded-rect "phone card" silhouette, positioned in the same on-screen row.
      Cuts between cards therefore always align the same shape at the same
      coordinates — a match cut by construction, not by careful manual alignment.
    where: shots 4-9 (frames 49-185), the entire montage body
    why_it_reads: >
      Because the silhouette never moves or changes shape across a cut, the eye
      reads 12 unrelated brands as "the same shelf, different item" instead of "a
      new video started" — it's what lets 21 raw cuts in 5.4s feel like one motion,
      not a slideshow.
    remotion_recipe: >
      Define one <PhoneCard> component (fixed aspect-ratio rounded-rect,
      overflow:hidden, drop-shadow) that takes a screenshot/video source as a prop.
      Drive an array of card data through a single parent that positions N cards
      with translateX = index*cardWidth - scrollOffset(frame), where
      scrollOffset(frame) is itself an interpolate()/spring() driven step function
      (see conveyorSlide below). Adding a 13th client card is appending one object to
      the data array, never a new composition or new keyframes.
    difficulty: moderate

  - id: settle-burst-settle-pacing
    what: >
      The edit alternates two distinct velocity states: multi-frame "settle" shots
      (12-36f, ease-out+overshoot, camera/conveyor fully still, 4 cards readable)
      and "burst" zones (multiple 3f sub-cuts totalling 9-24f, conveyor visibly
      sliding, motion-blurred).
    where: rhythm block below; settles = shots 1,2,3,4,6,8/10, bursts = shots 5,7,9
    why_it_reads: >
      Constant-speed scrolling reads as a lifeless marquee; constant flash-cutting
      reads as unwatchable noise. Alternating "let it breathe, then whip it" gives
      the montage a pulse — the viewer gets just long enough on each settle to parse
      a brand before the next burst refuses to let them linger.
    remotion_recipe: >
      Model the whole sequence as one array of {type: "settle"|"burst", dur_f,
      cards} segments. For "settle," spring() the conveyor offset to its target
      value with overshoot (damping ~12, stiffness ~180) and hold. For "burst,"
      step the offset in fixed increments every step_f frames with a hard cut (no
      interpolation between steps) — literally toggle between two different offset-
      calculation functions per segment rather than trying to fake both speeds with
      one continuous easing curve.
    difficulty: moderate

  - id: cta-card-isolate-outro
    what: >
      The final card breaks the conveyor grid pattern — instead of settling as a
      4-up row like every prior settle, it alone scales up and centers, ending the
      piece on one isolated hero product.
    where: shot 10, frames 186-190
    why_it_reads: >
      Ending on the same "4 cards in a row" composition as every other settle would
      make the video feel like it just ran out of runway; breaking the established
      pattern on the very last beat reads as an intentional, designed ending rather
      than a clip that got cut off.
    remotion_recipe: >
      Reuse the same <PhoneCard> component used throughout, but on the last
      segment interpolate its own scale/position directly to fill-frame (scale to
      ~1.8x, translate to center) instead of running it through the shared
      conveyor-offset function — i.e. the last card opts out of the grid layout
      function and animates independently.
    difficulty: trivial

rhythm:
  cut_count: 21
  median_shot_f: 3
  fastest_f: 3
  slowest_f: 36
  pattern: >
    49f hero intro (title → headline → browser scroll, 3 real cuts) → 36f single-card
    autoscroll (HIDE) → 24f burst (6 sub-cuts, RAIZE + Soapy Faith flash in) → 28f
    settle-with-bounce (4-card row, 8f static hold mid-shot) → 15f burst (5 sub-cuts,
    Puffy + SEE flash in) → 25f continuous accelerating slide (not a settle — plateaus
    briefly then keeps moving) → 9f burst (3 sub-cuts, Tericci/TATBROW/time—line) →
    5f final isolate-and-scale ending on one hero card. Contrast alternation is
    constant: every settle/burst pairs a dark-header card (HIDE, Puffy, Tericci —
    black) against a light one (Hello Dreamer, duyu, SEE, time—line — white/cream),
    never two visually-similar cards adjacent.
  beat_grid_f: 3
  energy_curve: wave

transferable:
  - Put every showcased item inside one identical container shape (same aspect ratio, same corner radius, same on-screen slot) so cuts between unrelated content read as a match cut for free.
  - Alternate a still "settle" (spring to rest, 4-up grid readable, ~1s) with a fast "burst" (fixed-step hard cuts every 3f, ~0.5-1s) rather than picking one constant montage speed.
  - Model the whole cut sequence as a data array of {type, dur_f, items} segments feeding one layout function, not as individually hand-placed cuts — this is what makes 21 cuts buildable and re-orderable.
  - Auto-scroll the full length of a single screenshot inside its frame instead of cutting to show "more of it" — one continuous scroll (autoScrollReveal) reads as one shot even when a huge amount of content passes by.
  - Break your own established pattern exactly once, on the last beat, to signal an intentional ending (here: the only card that isolates and scales instead of settling into a row).
  - Never let two adjacent cards/settles share a light/dark reading — force a contrast flip (dark-header ↔ light-header) at every boundary to keep a same-format montage from going visually flat.

avoid:
  - Don't hand-position and hand-keyframe 21 individual cuts in a timeline editor; drive the whole montage from one ordered array of card assets + segment types (settle/burst) through a single Remotion sequence-generator component — adding/removing/reordering a client project becomes a one-line data change.
  - Don't rotoscope or manually paint the wine-glass pour illustration in shot 2; if it needs to be original (not a stock asset), build it as an SVG path with a clip-path liquid-fill mask animated via interpolate(), not frame-by-frame paint.
  - Don't animate the internal email auto-scroll (shots 3-4) by hand-adjusting a scroll position per keyframe; it's a single translateY = interpolate(frame, [0, dur_f], [0, -distance_px], {easing}) call against a tall static screenshot/DOM capture.
  - Don't try to recreate the burst zones as literally 3-frame video cuts if retiming is likely; model them as the step function described in "settle-burst-settle-pacing" so changing step_f from 3 to 5 retimes the whole burst without touching individual cuts.

new_moves:
  - name: conveyorSlide
    params: {step_px: 340, step_f: 3, cards_visible: 4, settle_ease: backOut, overshoot_pct: 4}
    description: >
      A horizontal row of uniform cards (see MOVE_VOCAB's slidePush/marquee, but for
      N discrete items rather than 2 or an infinite loop). Offset is driven by a
      segment-typed function: during a "burst" segment it steps in fixed increments
      every step_f frames with a hard cut between steps (no easing within a step);
      during a "settle" segment it springs to a target offset with overshoot and
      then holds. cards_visible controls how many card-widths are on screen at once.

  - name: autoScrollReveal
    params: {distance_px: 1400, ease: linear|expoInOut}
    description: >
      Continuous translateY of a screenshot/DOM capture taller than its viewport,
      simulating a hands-free scroll through the full page inside a single
      uncut shot. Distinguishes from a cut-driven "reveal more content" approach —
      the whole page is shown as one take.
