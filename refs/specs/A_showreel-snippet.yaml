        target: wineGlassIcons
        at_f: 4
        params: {dur_f: 11, ease: springSnap, stagger_f: 3}
      - move: staggerRise
        target: bodyCopy
        at_f: 10
        params: {y: [28, 0], opacity: [0, 1], blur: [8, 0], dur_f: 14, ease: springSoft}
    camera: {move: null, params: {}}
    bg: {kind: flat, moves: []}
    treatment: []
    audio_cue: none
    transition_out: {move: hardCut, params: {}}
    hold_f: 2

  - n: 3
    t: [1.54, 2.04]
    frames: [37, 48]
    layout: full-bleed-ui
    content: >
      The whole hero card (title + headline + copy) scales down and the frame pulls
      back to reveal it sitting inside an actual browser mockup labelled
      "Creativecue.com," now showing a product grid below (wine gift boxes with
      "BUY NOW" / price rows: Toranti Umbria Red, Lusso Red Collection, Lamborghini
      Grechetto, Lamborghini Gold Prosecco). The mockup auto-scrolls down through the
