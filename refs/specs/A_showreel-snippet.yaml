id: A_showreel-snippet
source: https://x.com/byshubh_/status/1943022663485829471
category: ui-showcase
product_type: visual-product

format:
  aspect: "16:9"
  fps: 24
  duration_s: 7.958
  orientation: horizontal

detection_notes: >
  Source is natively 24fps (191 frames), not the pipeline's default-assumed 30fps —
  every frame number below is a native 24fps index matching profile.md / the burned
  timecodes on sheet_01.jpg and sheet_02.jpg. Multiply by 1.25 to retarget 30fps.
  Profile detected 21 cuts; 13 of those 21 are exactly 3f long (frames 85-87, 88-90,
  100-102, 103-105, 106-108, 137-139, 140-142, 143-145, 146-148, 149-151, 177-179,
  180-182, 183-185) — well under the vocab's 11f minimum shot length, so these are
  not independent shots, they are a single rapid-fire whip-cut BURST where a
  horizontally-scrolling filmstrip of phone-shaped mockups is sampled by the cut
  detector once per ~3-frame slide-step. Cross-checked against keys/04_f86.png
  through keys/09_f107.png (burst 1), keys/11_f138.png through keys/15_f150.png
  (burst 2), and keys/17_f178.png through keys/19_f184.png (burst 3): in every case
  consecutive "shots" show the same 4-card row shifted a few dozen px, not unrelated
  content — confirming this is one continuous conveyor motion, not 13 real edits.
  Below, the 21 detected cuts are merged into 10 authored shots: profile shots
  1/2/3 kept as-is (real cuts, each ≥12f); shot 4 kept as-is; shots 5-10 merged into
  "burst 1"; shot 11 kept as-is; shots 12-16 merged into "burst 2"; shot 17 kept
  as-is; shots 18-20 merged into "burst 3"; shot 21 kept as-is. rhythm.cut_count
  below reports the raw 21 for stats, pattern narrative uses the merged 10.

verdict: >
  A design agency's entire portfolio compressed into 8 seconds by treating every
  finished email as an interchangeable card on one continuous horizontal conveyor —
  the edit rhythm alternates readable settle-holds with whip-fast flash bursts, and
  every cut lands on the same rounded-rect card silhouette (a match cut by
  construction), so the montage never looks like 12 different projects glued
  together, it looks like one long shelf being scrolled past camera.

palette:
  bg: "#F0F0F0"
  ink: "#000000"
  accent: "#C0A8A8"
  support: ["#C0C0C0", "#483030", "#F0F0D8"]
  notes: >
    No single accent hue belongs to this reel — every card carries its own client's
    brand color (HIDE yellow, Soapy Faith maroon/pink, Nailboo hot pink, TATBROW
    pink), which is the point: the reel-frame itself stays neutral (near-white
    #F0F0F0/#C0C0C0 bg, pure black #000000 type) so 12 unrelated brand palettes can
    sit side by side without clashing. The one recurring warm thread is skin-tone
    photography (#483030 shadow, #C0A8A8 highlight) shared across the beauty/skincare
    cards (HIDE, Tericci, TATBROW). Brightness curve is light-dominant throughout
    (min 120/max 236) but dips into its "medium" band precisely across the
    black-header HIDE/Soapy Faith/Puffy cards — light/dark contrast is carried by
    which card is on screen, not by any reel-level lighting change.

typography:
  family_look: mixed
  weights: [regular, bold, black]
  case: mixed
  tracking: wide
  headline_frame_share: 0.55
  notes: >
    The opening hero ("ELEVATE YOUR PALATE" / "FEATURED COLLECTIONS") is serif
    display, upper-case, wide-tracked — a single intentional type choice for this
    reel's own title card. Every card after that is verbatim, un-restyled client
    creative (HIDE's grotesk, Nailboo's condensed display, Tericci's editorial
    serif, time—line's spaced-out wordmark) — the reel does not impose a type
    system on the work it's showing, which is itself the honest thing to copy: don't
    reskin the screenshots, let each one read as-is.

structure:
  - act: hook
    t: [0.0, 2.04]
    purpose: open on one hero project (a wine gift-box email) given real time to breathe — title, headline, body copy, then zoom into the actual browser mockup and scroll its product grid — establishing "these are real, working deliverables" before the pace increases.
    shots: [1, 2, 3]
  - act: proof
    t: [2.04, 7.38]
    purpose: prove breadth and speed by conveyor-scrolling ~10 more client emails past camera, alternating readable settle-holds (so the eye can register a brand) with whip-fast flash bursts (so it never drags) — the edit rhythm itself is the pitch ("we ship a lot, fast").
    shots: [4, 5, 6, 7, 8, 9]
  - act: cta
    t: [7.38, 7.958]
    purpose: break the conveyor pattern on the last card — pull it out of the row and center/enlarge it alone — so the reel ends on one clean hero product rather than fading out mid-row.
    shots: [10]

shots:
  - n: 1
    t: [0.00, 0.79]
    frames: [0, 18]
    layout: centre-stack
    content: >
      Cream/off-white bg. "ELEVATE YOUR PALATE" (upper-case, wide-tracked, serif,
      small) fades up centred; a wine-glass illustration begins animating in from
      lower-left.
    moves:
      - move: staggerRise
        target: kicker
        at_f: 0
        params: {y: [18, 0], opacity: [0, 1], dur_f: 14, ease: springSoft}
    camera: {move: null, params: {}}
    bg: {kind: flat, moves: []}
    treatment: []
    audio_cue: none
    transition_out: {move: hardCut, params: {}}
    hold_f: 4

  - n: 2
    t: [0.79, 1.54]
    frames: [19, 36]
    layout: centre-stack
    content: >
      "FEATURED COLLECTIONS" (serif display, large) grows in below the kicker; two
      wine-glass illustrations (one pouring red, one splashing white) pop in flanking
      the headline; body copy "Make any occasion truly special by putting just the
      right elegant gift box of Lamborghini sparkling or still wine." fades in below.
    moves:
      - move: maskWipeUp
