    frames: [137, 151]
    layout: grid
    content: >
      BURST 2 (15f, sampled as 5 sub-cuts of 3f each). HIDE card exits left edge;
      Puffy ("$1,350 off, Welcome to Puffy," black-luxury mattress) and SEE Eyewear
