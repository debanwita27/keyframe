    t: [4.54, 5.71]
    frames: [109, 136]
    layout: grid
    content: >
      The conveyor settles with an overshoot/bounce (confirmed by motion.csv: motion
      value falls from 14.6 at f112 to 0.03 by f116 then holds near-zero through
