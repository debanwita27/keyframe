id: jittervideo_B_recreating-this-fifa-logo-animation-took-j
source: local-reference (jittervideo_B_recreating-this-fifa-logo-animation-took-j.mp4)
category: ui-showcase
product_type: visual-product

format:
  aspect: "9:16"
  fps: 30
  duration_s: 52.699
  orientation: vertical

verdict: >
  A talking-head tutorial that turns Jitter's AI "Superagent" chat into the hero: instead
  of showing a finished logo animation, it screen-records a real prompt-to-result loop
  (type a request, watch an expanding step list, watch the canvas update) four times in a
  row, and the payoff effect itself — 18 copies of one identical vector silhouette scaled
  to a geometric spread of sizes and re-stacked smallest-in-front — is a mask-is-the-subject
  trick: no reveal, no clip-path, just concentric self-similar shapes whose scale delta
  alone reads as a hypnotic portal around the static FIFA emblem.

palette:
  bg: "#F0F0F0"
  ink: "#181818"
  accent: "#7848D8"
  support: ["#D8D8F0", "#7890D8", "#000000", "#181830", "#C81818", "#186830", "#78D818", "#3050C8"]
  notes: >
    Two completely separate palettes coexist and never blend. The UI chrome (chat panel,
    layers list, property inspector, browser frame) is neutral: off-white #F0F0F0 panels,
    near-black #181818/#000000 text and dark-mode surfaces (#181830, #181818), one
    accent purple #7848D8 used only for selection outlines, the diagonal transition bars
    between beats, and the "Duplicate/duplicate" highlighted phrase in prompts. The LOGO
    ARTWORK itself carries its own fixed 8-swatch rainbow ramp (dark red -> dark green ->
    bright green -> blue -> light blue, repeating) which is the actual subject-matter
    palette and is never used anywhere in the chrome — the two systems are kept visually
    distinct on purpose so the viewer always knows "product UI" vs "the thing being made."

typography:
  family_look: geometric sans
  weights: [medium, bold]
  case: sentence
  tracking: normal
  headline_frame_share: 0.3
  notes: >
    No headline card anywhere in the video — copy exists only as (a) chat-bubble prompt
    text at UI scale, and (b) a burned-in single-bold-word caption in a white
    rounded-rect chip, one word on screen at a time, swapped roughly every 5 frames in
    sync with the voiceover ("Here's" / "how to" / "recreate" / "FIFA" / "logo" /
    "animation" / "using" / "Jitter"). The word-chip is the only "typography as hero"
    moment; everything else is functional product-UI type at 11-14px equivalent.

structure:
  - act: hook
    t: [0.0, 4.13]
    purpose: >
      Cold open on the presenter naming the exact deliverable ("recreate this FIFA World
      Cup logo animation with Superagents") while flash-cutting to glimpses of the
      finished psychedelic result, so the payoff is promised before any process is shown.
    shots: [1]
  - act: capability
    t: [4.13, 11.03]
    purpose: >
      Establish the starting assets (base silhouette, 8-color reference ramp, FIFA
      emblem) already on the canvas, then open the AI assistant panel via a real
      right-click menu.
    shots: [2, 3]
  - act: capability
    t: [11.03, 23.9]
    purpose: >
      First and second AI prompts: duplicate the base shape 8x with a color per
      duplicate, then duplicate the whole set again and fix draw order — shown as a real
      chat exchange with a visible multi-step "thinking" trace, not a cut-to-result.
    shots: [4, 5]
  - act: reveal
    t: [23.07, 38.03]
    purpose: >
      Third prompt asks the agent to scale all 18 copies to a distributed size range with
      staggered overshoot easing; the agent narrates its plan back before the canvas
      commits, then the concentric rainbow "portal" bursts open around the static logo —
      the single most important visual beat in the video.
    shots: [6, 7]
  - act: proof
    t: [38.03, 52.7]
    purpose: >
      A fourth prompt asks for a seamless loop (expand-hold-contract with mismatched
      easing/timing so it doesn't look like a bounce); the tool offers a Version 1/Version
      2 comparison, then the finished pulsing loop plays out to the end of the video.
    shots: [8, 9, 10]

