techniques:
  - id: concentric-self-similar-shape-scale-burst
    what: >
      One identical vector silhouette (a two-lobe rounded bracket/figure-8 shape,
      originally sized to match the FIFA wordmark's negative space) is duplicated 18
      times, each copy given a fill from an 8-color rainbow ramp cycling in order, and
      each copy scaled to a different target between 133% and 945% of its original size
      with a 1-frame stagger between layers. The stack is z-ordered so the SMALLEST
      scale sits frontmost and the LARGEST sits backmost. Because every layer shares
      the exact same silhouette and centre point, the scale differences alone produce
      concentric self-similar "rings" — a hypnotic portal/tunnel effect with no
      traditional mask or reveal edge anywhere. The static FIFA emblem sits fixed in
      the centre, untouched, the whole time. The loop is made seamless by holding the
      expanded state, then animating every layer back to 100% with a faster,
      no-overshoot ease in the REVERSE stagger order (smallest-scaled/frontmost layer
      first, largest/backmost layer last).
    where: shots 7, 9, 10 (frames 962-1141, 1477-1526, 1527-1579)
    why_it_reads: >
      The mask/shape IS the subject here, not a reveal device: there is no content
      being uncovered, only one shape's scale multiplied across 18 instances. The eye
      reads the concentric self-similarity as depth/motion (like a Droste zoom or a
      camera dolly through a tunnel) even though nothing moves in 3D and no camera
      exists — it's 18 flat 2D layers animating `transform: scale()` on independent
      timers. Staggering by exactly 1 frame per layer is what turns a simultaneous pop
      into a travelling "ripple" from the centre outward.
    remotion_recipe: >
      Render one <svg> path (or a CSS shape built from two overlapping rounded
      rectangles with corner-radius cutouts) once. Mount it as 18 absolutely-positioned,
      centre-anchored layers, indices i=0..17. Precompute an 18-length scale-target
      array distributed between 1.33 and 9.45 (roughly geometric spacing looks closest
      to the reference — do not use linear spacing, it reads flat). Assign
      z-index = 17 - i so the layer with the SMALLEST target scale paints on top.
      Assign fill = rainbowRamp[i % 8] from a fixed 8-swatch array. Drive each layer's
      scale with interpolate(frame - i * 1, [0, 18], [1, scaleTarget[i]], {
      easing: Easing.out(Easing.back(1.4)) }) for the expand phase (stagger_f = 1,
      backOut-style overshoot). For the seamless-loop contraction, run a second phase
      driven by interpolate(frame - holdEndF - (17 - i) * 1, [0, 10], [scaleTarget[i], 1],
      { easing: Easing.in(Easing.cubic) }) — note the stagger index is INVERTED
      (17 - i instead of i) and the duration is shorter (10f vs 18f) with zero overshoot,
      which is what makes the return read as a snap rather than a bounce-back of the
      same motion in reverse.
    difficulty: moderate

  - id: ai-chat-build-as-narrative-device
    what: >
      Instead of cutting straight to results, the video treats each capability as a
      three-beat unit: (1) a prompt is composed in a chat bubble, (2) a collapsible
      step-trace expands one line at a time ("Thinking...", "Inspecting selection and
      artboard", "Searching the project...", "Reading shape and rectangle fills", ...,
      "Applied N changes"), (3) the canvas updates and a "Current version, N changes"
      pill appears as a de facto commit/checkpoint marker. A later beat adds a
      "Version 1 / Version 2" side-by-side comparison before accepting a change.
    where: shots 4, 5, 6, 8, 9 (frames 332-1526)
    why_it_reads: >
      Showing the AI's intermediate reasoning as a legible, staged list (not a spinner,
      not raw logs) makes an opaque "magic" AI feature feel auditable and trustworthy —
      exactly the thing a tool company needs to sell about an AI agent feature. The
      version-compare beat additionally reframes the agent as collaborative/reversible
      rather than a black box that overwrites your file.
    remotion_recipe: >
      Build the step-trace as an array of strings; reveal with staggerRise (y 10->0,
      opacity 0->1, blur 4->0, stagger_f 4) one row at a time, each row's start frame
      driven by a running index rather than by real elapsed "thinking" time. The
      "Current version, N changes" pill is a simple scaleIn/popIn keyed to the same
      commit frame as the canvas update, so the two always land together. The
      Version 1/Version 2 comparator is two duplicate canvases in a split layout with a
      shared vertical divider; no special masking needed.
    difficulty: trivial

  - id: skew-card-panel-transition
    what: >
      Between UI states (canvas -> properties panel, canvas -> layers panel), instead
      of a hard cut or slide, the whole canvas card keystones in 3D — skewY and
      rotateY animate together while the card translates sideways — as if a corner of
      it is being peeled back, revealing the next panel underneath before the card
      un-skews back to face-on.
    where: shots 3, 5 (frames 242-331, 537-627)
    why_it_reads: >
      A flat slide/fade would read as two disconnected screens; the keystone motion
      keeps the illusion that it is one continuous physical surface being turned, which
      buys a beat of "something is happening" during what is otherwise a context-menu
      click.
    remotion_recipe: >
      Wrap the canvas card in a container with CSS `perspective: 1000px`. Animate
      `transform: rotateY(deg) skewY(deg) translateX(pct)` together over ~24-30f with
      expoInOut, transform-origin at the card's left edge (the side it appears to pivot
      from) so it reads as being peeled rather than just rotated in place. Reveal the
      panel underneath as a simple staggerRise so it doesn't compete with the skew.
    difficulty: moderate

rhythm:
  cut_count: 10
  median_shot_f: 158
  fastest_f: 90
  slowest_f: 270
  pattern: >
    124f talking-head hook (internally stutter-cut every 5-12f between presenter and
    teaser flashes) -> three ~90-205f "type a prompt, watch it think, watch it commit"
    beats -> a 180f payoff burst -> a 280f "make it loop" repeat of the prompt cycle ->
    a 105f version-compare + replay -> a 53f final loop-out with no CTA card. The whole
    video is built from exactly one repeating narrative unit (prompt -> trace -> result)
    run four times, which reads as rhythm even though the literal cut lengths vary
    widely.
  beat_grid_f: null
  energy_curve: wave

transferable:
  - Steal concentric-self-similar-shape-scale-burst (one silhouette, N copies, N
    distributed scale targets, 1-frame stagger, smallest-in-front z-order) as the
    default recipe any time a brief calls for a "portal/tunnel/hypnotic" background —
    it needs zero masking, only transform:scale() and z-index.
  - Make the loop's contraction phase use inverted stagger order + shorter duration +
    zero overshoot vs. the expansion phase; symmetric reverse-of-the-same-easing reads
    as a bounce, not a breath.
  - Narrate an AI feature by showing its intermediate steps as a short, legible,
    staggered checklist rather than a spinner — it is the single cheapest way to make
    an AI capability demo feel trustworthy instead of magical.
  - Use a "Current version, N changes" commit pill timed to land on the exact frame the
    canvas updates, so chat and canvas always feel causally linked.
  - A single-word, narration-synced caption chip (swap every ~5f) is a legitimate
    alternative to a full subtitle line when the copy is a spoken sentence rather than
    a design headline — keep it small and let the visual carry the frame.
  - The skew/keystone card transition is a cheap way to make cutting between two flat
    screenshots feel like one continuous surface — reserve it for panel-to-panel
    transitions, not for every cut.

avoid:
  - Frames 184-194, 644-658, 882-893, and 1277-1288 are genuinely dead holds (flagged
    by the analyzer as frozen on all three motion scales) that happen because the real
    product UI has nothing to animate while "Thinking..." — if recreating this beat in
    code, do NOT reproduce the dead air; add a low-amplitude breathe or a pulsing
    "thinking" indicator so no frame is truly static.
  - The chat bubble text and the step-trace lines are a real screen recording of a real
    product, not hand-typed AE text animation — don't hand-key each character; drive
    reveals purely from array index / frame math (typeOn's chars_per_f, staggerRise's
    stagger_f) exactly as the source vocabulary already prescribes.
  - The talking-head segment's webcam framing and lighting is unscripted (home office,
    real face) — don't try to art-direct or relight this kind of shot; treat presenter
    footage as a fixed input and spend the craft budget on the caption chip and the
    cutaway timing instead.
  - The exact FIFA-logo geometry (arced trophy silhouette, wordmark kerning) is a
    licensed mark — the transferable asset is the "one shape, 18 scaled self-similar
    copies" TECHNIQUE, not this specific silhouette or brand.

new_moves:
  - name: concentricShapeBurst
    params: {layers: 18, scale_from: 1.0, scale_to_range: [1.33, 9.45], stagger_f: 1, ease: backOut, order: "outer-to-inner or reversed"}
    description: >
      N identical, centre-anchored copies of one silhouette, each scaled from 1.0 to
      its own target in a precomputed target array spanning scale_to_range, staggered
      by stagger_f frames per layer, z-ordered smallest-scale-frontmost. Colors cycle
      through a fixed short palette array by layer index modulo palette length. Because
      every copy shares one silhouette, the scale spread alone reads as concentric
      rings/a portal — the mask/shape is the entire subject, not a reveal mechanism.
      For a seamless loop, run a second pass back to 1.0 with inverted stagger order,
      shorter duration, and a non-overshooting ease (expoIn/"impulse") so contraction
      reads as a snap rather than the expansion in reverse.
  - name: captionWordFlash
    params: {swap_every_f: 5, style: "white pill, bold black text", crossfade_f: 2}
    description: >
      A single bold word inside a small white rounded-rect chip, swapped for the next
      word in a fixed sentence array every swap_every_f frames, crossfaded over
      crossfade_f frames rather than hard-cut. Used as a narration-synced subtitle
      track when the copy is a spoken sentence rather than a design headline — distinct
      from typeOn (continuous per-character) and wordCycleSettle (candidates
      converging on one final word) because every word is final and none are discarded.

convergence:
  - staggerRise (list/row reveal with y+opacity+blur, 2-4f stagger) — identical
    mechanism to A_explainer-zhylar-crm-cpq's metric-card and form-field reveals.
  - scaleIn with backOut overshoot for cards/panels (comparison card, selection
    handles) — same params class as the byshubh_ corpus's modal/card entrances.
  - flashCut as a transition/energy-spike device between beats — used identically in
    A_explainer-zhylar-crm-cpq's shot-1 and shot-2 punches.
  - orbit3D-family "tilt a flat UI card in 3D perspective, then settle" — this
    reference's skewCardTransition is a variant of the same raked-3D-card-flatten
    idea documented in A_explainer-zhylar-crm-cpq's techniques.
  - driftCamera as the default ambient move under an otherwise static UI shot.

detection_notes: >
  The raw 44-cut detection is almost entirely false positives from two sources that are
  NOT real shot changes: (1) the burned-in single-word caption chip swapping every ~5
  frames throughout the entire video (this alone accounts for the majority of "hot,
  4-6f, linear/constant-velocity" entries in the profile's shot table — e.g. rows 2-8,
  11, 15-18, 21, 23, 26-27, 29-31, 34-37, 40-41, 43), and (2) the chat-panel text
  building/highlighting word-by-word inside an otherwise unchanged UI frame (rows 9-10,
  12-14, 19-20, 22, 24, 28, 32, 38-39, 42, 44). None of these represent a real change of
  subject, camera, or layout, so this spec merges all 44 detected cuts into 10 real
  content shots keyed to genuine state changes: canvas-establish -> panel-open ->
  prompt-1-result -> prompt-2-reorder -> prompt-3-composition -> scale-burst-payoff ->
  prompt-4-composition -> version-compare-replay -> final-loop-out. The four confirmed
  "frozen stretch" bugs (frames 184-194, 644-658, 882-893, 1277-1288) fall inside shots
  2, 5, 6, and 8 respectively and are called out under `avoid` rather than merged away,
  since they are genuine dead-air flaws in the source, not detection artifacts.
