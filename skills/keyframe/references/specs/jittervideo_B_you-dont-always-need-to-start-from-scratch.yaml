techniques:
  - id: noise-masked-pixel-dissolve-reveal
    what: >
      The video's single most-used entrance: an image or headline resolves from
      an unreadable mosaic into a crisp final frame. It is not a fade — the
      on-screen effect panel (frames 1532-1617) names it exactly:
      "Noise-Masked Pixelate", with parameters Pixel Size, Pixel Size Step,
      Noise Scale, Speed, Threshold, Noise Enabled, animating from an Initial
      value (Pixel Size ~100, Noise Scale 4, Speed 1, Threshold 0.5) to a To
      value (Pixel Size 1, Pixel Size Step 12, Noise Scale 2, Speed 1,
      Threshold 0.6) over an Animation Duration of 1s.
    where: shots 2, 6, 9, 11, 12 — every appearance of the "CRAFTED SOUND" poster and the "Pixelated Slideshow" template tiles
    why_it_reads: >
      Because the reveal mask is itself irregular (noise-driven, not a straight
      edge or simple circle), the eye reads it as the image "developing" or
      "materialising" rather than being wiped or faded — it borrows the
      language of a Polaroid developing or a signal resolving out of static,
      which suits a headline about audio/sound product.
    remotion_recipe: >
      Render the source (photo or text-as-image) into an offscreen canvas at
      full resolution. Each frame, derive pixelSize = interpolate(frame,
      [0,durF], [100,1], {easing: Easing.out(Easing.exp)}) and threshold =
      interpolate(frame, [0,durF], [0.5,0.6]). For each pixelSize×pixelSize
      block: (1) average its source colour to get the mosaic look; (2) sample a
      deterministic 2D value-noise field at the block's grid coordinate, seeded
      by a fixed integer (never Date.now/Math.random) plus a slow phase term
      driven by frame*speed/30 so the noise itself drifts; (3) draw the block
      only if noise(blockX, blockY, phase) > threshold, else leave it
      transparent/background-coloured. As pixelSize shrinks and threshold
      rises, more, smaller, sharper blocks become visible until the image reads
      as fully resolved. Implement as a single WebGL/Canvas2D shader-like pass
      driven by useCurrentFrame(); do this with a fragment shader (GLSL) for
      performance if targeting >200px images, or a coarse-grid Canvas2D loop
      (~2500 blocks max) if not.
    difficulty: moderate

  - id: dithering-duotone-halftone-reveal
    what: >
      A circular logo/photo resolves from a flat gradient into a visible
      ordered-dither halftone pattern, remapped into two tones (duotone). The
      panel is explicitly labelled "Dithering Effect" / "Dithering Duotone
      Effect" in the layer tree (Duotone > Text/Buy Tickets/Logo
      Container/Earth Video/Background).
    where: shot 5, frames 509-597 (AI Summit pink-circle card)
    why_it_reads: >
      A fixed, recognisable dither grain (Bayer matrix) reads as "printed" or
      "screen-printed" rather than digital, which sells the duotone poster
      aesthetic instantly and cheaply — no photographic detail is needed, just
      luminance.
    remotion_recipe: >
      Precompute an 8x8 Bayer threshold matrix (values 0-63, normalised
      0-1). Per source pixel, compute luminance, remap it through a two-colour
      gradient map (duotone), then reveal it only if a coverage value
      (interpolated 0→1 over dur_f with expoOut, driven by frame) exceeds
      bayerMatrix[x % 8][y % 8]. This is a single shader pass; no per-pixel
      randomness, fully deterministic and reproducible frame-to-frame.
    difficulty: moderate

  - id: live-ticking-template-grid
    what: >
      A dense 2x3 grid of template preview tiles ("New" section) stays legible
      not by enlarging or sequencing them, but by giving every tile a distinct
      colour and exactly one moving element — usually a number counting up or
      down at its own rate (7, 22→42, 5→3, 38, plus a spinning progress ring).
    where: shot 3, frames 327-421
    why_it_reads: >
      Nothing needs to be read in order — each tile is legible in isolation via
      colour-coding, and the simultaneous but independently-timed motion (no
      shared stagger) reads as "many live examples," proving variety in one
      glance instead of a slow one-by-one carousel.
    remotion_recipe: >
      Render N tiles in a CSS grid. Give each tile a fixed accent colour and
      one animated primitive: interpolate(frame, [tileStartF, tileStartF+durF],
      [fromN, toN]) for the counters (monospace_digits, per MOVE_VOCAB
      counterUp), driven at a different durF per tile (e.g. 60f, 90f, 45f) so
      they visibly desync — this desync is the point, don't align them to one
      shared clock.
    difficulty: trivial

  - id: raked-3d-linked-action-timeline
    what: >
      A timeline/properties panel is shown tilted in shallow 3D perspective
      (as if laid on a table), and rows that share a linked animation
      (Duotone, Text·Noise-Masked-Pixelate, Text·Appear, Earth Video·Duotone
      Dither, Earth Video·Play) light up in the same purple simultaneously
      before being copy/pasted onto a different layer.
    where: shot 8, frames 898-1007
    why_it_reads: >
      "These five things are linked" is an abstract claim about the tool's
      data model; making the linked rows glow the identical purple at the
      identical moment turns it into something you see rather than something
      you're told. The raked 3D entrance is the same trick as Zhylar's
      invoice/email card entrances — see convergence.
    remotion_recipe: >
      Wrap the panel in a container with CSS perspective: 1000px, animate
      rotateX from ~10deg to 0 over ~20f (expoInOut) so it "lands flat" — this
      is orbit3D from MOVE_VOCAB applied to a 2D panel instead of a product
      card. For the linked-row highlight, keep an array of linkedRowIds; set
      each matching row's background-color and its animation-bar fill to the
      same accent purple with opacity interpolated 0.3→1 over a short
      staggerRise (stagger_f 2-3) so they arrive together, not row-by-row.
    difficulty: moderate

  - id: cursor-driven-parameter-scrub
    what: >
      A synthetic cursor repeatedly grabs a single numeric field (Move Y,
      Pixel Size, an easing-curve handle, an intensity slider) and drags it
      live, with the poster/effect preview updating in real time as the value
      changes — the choreography IS the tutorial content, not a decoration on
      top of it.
    where: shots 7, 8, 10, 11, 12, 13 — every UI-configuration beat
    why_it_reads: >
      Per PRINCIPLES.md's "Choreograph a synthetic cursor" rule: a fake
      pointer can land on a beat grid and its drag gestures can be timed to
      match voiceover exactly, which a real screen recording never can. It
      also visually proves cause-and-effect (drag this number, this pixel
      changes) instead of just claiming the tool is "customisable."
    remotion_recipe: >
      Define a cursorDrag move: an absolutely-positioned cursor icon
      interpolates position along 2-4 key points (arrive at field → click-dip
      scale 0.9 over 4f springSnap → drag along an axis while a bound numeric
      value interpolates in lockstep → release, scale back to 1 with a small
      overshoot). Bind the "live value" text and any dependent visual (e.g. the
      poster's pixelSize) to the same interpolated value so cursor motion and
      on-screen effect are mathematically the same driver, never two separate
      animations that merely look synced.
    difficulty: moderate

rhythm:
  cut_count: 13
  median_shot_f: 135
  fastest_f: 34
  slowest_f: 330
  pattern: >
    5.4s real-camera talking-head hook -> 4s hard-cut poster cold-open (pays off
    the whole video's destination up front) -> five 87-166f UI-tour shots
    establishing breadth (template grid, effects catalogue, two more templates,
    layer tree) -> a 330f deep-dive UI-tutorial dwell (splitting this run's
    shots 8-10 in the raw analysis) configuring one entrance curve by hand,
    the slowest and most static stretch in the video -> a re-acceleration
    through background-swap, pixel-size tuning and duplicate-offset glitch
    stacking -> a closing settle-scale beat and a long static hold on the
    finished poster. Energy dips hard mid-video during the curve-editor
    tutorial and climbs back for the glitch-stack and final reveal.
  beat_grid_f: null
  energy_curve: wave

transferable:
  - Steal the Noise-Masked Pixelate reveal (technique noise-masked-pixel-dissolve-reveal)
    as a default hero-title/logo entrance whenever the product has any connection
    to audio, signal, or "clarity from noise" messaging — it's a threshold test
    against a deterministic noise field, not a shader mystery.
  - Steal the live-ticking numeric counters inside a dense preview grid
    (technique live-ticking-template-grid) any time you need to show "many
    templates/presets exist" without a slow one-by-one carousel — colour-code
    each tile and desync their animation clocks.
  - Steal the raked-3D-panel-plus-linked-highlight (technique
    raked-3d-linked-action-timeline) whenever a claim about hidden data
    relationships ("these are connected") needs to be shown, not said.
  - Steal cursor-driven parameter scrubbing (technique
    cursor-driven-parameter-scrub) for any tutorial-style capability beat —
    bind the cursor's drag value and the visible effect to the same
    interpolated number so they can never desync.
  - The caption pill that swaps one to three words at a time (never a full
    sentence at once) is the correct way to subtitle a talking-head hook —
    reuse captionSwap instead of a typewriter or a static lower-third.
  - Steal the duplicate-and-timeline-offset pattern for any "glitch/echo"
    effect — stack 2-3 copies of one effect layer at small time offsets rather
    than hand-building a multi-layer glitch shader from scratch.

avoid:
  - The real-camera talking-head cold open (shot 1) is live footage, not
    something to fake convincingly with 3D/CSS — substitute a synthetic
    voiceover-only cold open or a text-card hook if no real presenter exists;
    don't attempt a fake human.
  - The word-by-word caption sync (captionSwap) must be driven off a
    pre-timed transcript array (word, startFrame), never hand-keyframed per
    word — eyeballing sync in a timeline is exactly the manual-keyframing
    trap this system exists to avoid.
  - The 330f curve-editor tutorial dwell (shot 10) only works because a
    synthetic cursor is continuously doing visible work (typing, opening
    menus, dragging a handle) for the entire duration — never replicate a
    hold this long in a pure marketing cut without equivalent continuous
    on-screen activity, or it reads as dead air per PRINCIPLES.md rule 4.
  - Don't attempt the Noise-Masked Pixelate or dithering effects as a cheap
    opacity crossfade — a bare fade shares none of the "resolving out of
    noise" read; budget for an actual per-block/per-pixel shader pass.

new_moves:
  - name: captionSwap
    params: {swap_every_f: "5-15 (per spoken word)", crossfade_f: 3, ease: expoOut}
    description: >
      A single caption pill holds one to three words at a time; its text
      content is swapped (not accumulated) roughly on each spoken word,
      crossfading over crossfade_f frames rather than a hard cut. Distinct
      from typeOn (continuous per-character with caret) and wordCycleSettle
      (multiple parallel columns that converge) — this is one slot, one
      value at a time, driven by a pre-timed transcript array of
      {word, startFrame} pairs, for subtitling a talking-head or voiceover
      hook.
  - name: pixelNoiseReveal
    params: {pixel_size: [100, 1], noise_scale: [4, 2], threshold: [0.5, 0.6], dur_f: 30, ease: expoOut}
    description: >
      An image or text-as-image resolves from an unreadable mosaic into a
      crisp final frame. Divide the source into pixel_size×pixel_size blocks
      (pixel_size animates large→small); each block is visible only where a
      deterministic 2D noise field (seeded, not random per-frame) sampled at
      that block's coordinates exceeds a threshold value that also animates
      over the same duration. The mask shape is the noise field itself, not a
      geometric primitive — this is the shape-driven-masking case where the
      mask literally IS the reveal's visual identity, not a hidden wipe.
  - name: ditherReveal
    params: {matrix: bayer8x8, coverage: [0, 1], dur_f: 20, ease: expoOut}
    description: >
      An image resolves into a fixed ordered-dither (Bayer matrix) halftone
      pattern remapped through a two-colour duotone gradient map. A single
      coverage value animates 0→1; a pixel is revealed once coverage exceeds
      the corresponding cell of the tiled Bayer matrix. Deterministic and
      grain-like rather than noisy — reads as "printed," pairs well with
      pixelNoiseReveal on adjacent elements for visual variety without
      inventing a third mask language.
  - name: cursorDrag
    params: {path: "2+ key points", dur_f: 40, click_scale_dip: 0.9, ease: expoInOut}
    description: >
      A synthetic cursor icon moves along 2 or more key points to simulate a
      real interaction: arrive at a control, dip scale to click_scale_dip on
      "click" (springSnap, ~4f), drag along an axis while a bound numeric
      value or panel state interpolates in exact lockstep with cursor
      position (never a separately-timed animation), release with a small
      scale-overshoot settle. The cursor's motion and the UI's response must
      share one interpolation driver so they can't visibly desync.

convergence:
  - counterUp — both corpora use live-ticking monospace numbers inside UI
    cards as proof of "it's working" (Zhylar's Lead/Deals metric cards vs.
    Jitter's six "New" template-grid counters).
  - raked-3D UI panel entrance (perspective + rotateX/Y animating to 0) —
    Zhylar tilts invoice/email cards flat on entrance; Jitter tilts its
    timeline/properties panel the same way before the linked-action
    highlight (technique raked-3d-linked-action-timeline here vs.
    raked-3d-ui-card-flatten in A_explainer-zhylar-crm-cpq).
  - dropShadowSoft on every floating UI card/panel in both corpora — a
    single soft shadow, never a stacked or hard-edged one, is the shared
    default for "this UI is a physical object above the background."

detection_notes: >
  The raw profile detected 22 cuts; five of them are 4-5f "hot, linear"
  entries (frames 419-423, 898-901, 1259-1263, 1798-1801, 1924-1927) that sit
  inside otherwise-continuous UI or poster footage on the sheets — these are
  encoder/compression flicker or single-frame UI redraws, not real cuts, and
  are folded into the neighbouring shot in this spec (they fall under the 11f
  minimum-shot-length rule in MOVE_VOCAB.md). Conversely, the profile's shot 9
  (frames 595-897, 303f, logged as one "subtle" shot) actually contains four
  visually distinct UI panels on the sheets — the AI Summit/Love-wins template
  pair, the Inward-Echo/LOVE-HATE template pair, and the layer-tree editor —
  which the cut detector missed because the screen-recording's luma delta
  between panel swaps stayed below its 26.0 threshold. This spec splits that
  range into shots 5, 6 and 7 to keep each distinct panel documented
  separately. Shot 10 in this spec (frames 1078-1261, 184f) is similarly a
  single detector-shot that spans several real UI states (property-tab switch,
  Move-value entry, curve-picker grid, curve-handle drag, intensity slider) —
  kept as one shot here because it is one continuous, uninterrupted screen
  capture, but documented as a multi-beat tutorial dwell in the rhythm pattern
  and in technique cursor-driven-parameter-scrub.
