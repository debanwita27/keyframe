    shots: [1]
  - act: reveal
    t: [5.47, 9.57]
    purpose: Cut straight to the finished hero poster resolving out of noise — show the destination before teaching the method.
    shots: [2]
  - act: capability
    t: [9.57, 14.13]
    purpose: Tour the template library and its effect catalogue to establish breadth of starting points.
    shots: [3, 4]
  - act: capability
    t: [14.13, 23.9]
    purpose: Show effect variety applied to other live templates, then drill into one template's layer structure.
    shots: [5, 6, 7]
  - act: capability
    t: [23.9, 42.9]
    purpose: Copy a linked animation from the template onto the new headline, then hand-tune its entrance curve.
    shots: [8, 9, 10]
  - act: capability
    t: [42.9, 59.9]
    purpose: Swap in a personal background image, tune the pixelate effect's intensity, then stack duplicates for a glitch.
    shots: [11, 12]
