id: jittervideo_B_you-dont-always-need-to-start-from-scratch
source: local-reference (jittervideo_B_you-dont-always-need-to-start-from-scratch.mp4)
category: ui-showcase
product_type: visual-product

format:
  aspect: "9:16"
  fps: 30
  duration_s: 67.699
  orientation: vertical

verdict: >
  A talking-head tutorial that builds one hero poster ("CRAFTED SOUND") live inside
  Jitter, and in doing so exposes three code-native gold mines: a real "Noise-Masked
  Pixelate" effect (mosaic block-size + noise-field threshold, both frame-driven) used
  as the title's entrance mask, a dense template grid kept legible by giving every
  tile its own live counter instead of a static thumbnail, and a raked-3D timeline
  panel with a purple "linked actions" highlight that makes an abstract keyframe
  relationship visually concrete before a copy/paste.

palette:
  bg: "#F0F0F0"
  ink: "#000018"
  accent: "#A890C0"
  support: ["#D8D8F0", "#F0D8F0", "#F0F0D8", "#D8D8D8"]
  notes: >
    Two registers that never mix in-frame: the app chrome is light-dominant
    (F0F0F0/D8D8F0 greys and lavenders, ~53% of the frame) with a saturated
    Jitter-purple (~#7B2FF7, interpolated — the header bar, selection highlights,
    "New" pill, linked-action bars) rationed to interactive/selection states only.
    The poster-in-progress ("CRAFTED SOUND") lives in its own dark register:
    near-black navy (#000018) to mid blue-violet gradient, white display type, with
    one hot-pink dither fill (~#F6B0EA) and one cyan gradient card (~#1C86E0) shown
    briefly as alternate template colourways. Talking-head shot: warm yellow mug
    accent against a cool purple-lit bookshelf background — the only place warm and
    cool tones share a frame.

typography:
  family_look: geometric sans
  weights: [medium, bold]
  case: mixed
  tracking: tight
  headline_frame_share: 0.46
  notes: >
    Poster headline "CRAFTED SOUND" is a bold condensed geometric sans, upper case,
    tight tracking, two lines, ~46% of frame width — the actual deliverable being
    taught, so it is the single largest text element in the video. Spoken captions
    render as a small white pill with black text, sentence case, one to three words
    at a time, bottom-third of frame — a live-caption style, not a designed headline.
    In-app UI text (panel labels, layer names, parameter fields) is a small
    geometric sans at ~11-13px equivalent, always inside a card/rail/tree, never
    floating.

structure:
