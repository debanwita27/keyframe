id: jittervideo_A_introducing-superagents-remix-resize-trans
source: local-reference (jittervideo_A_introducing-superagents-remix-resize-trans.mp4)
category: launch-video
product_type: visual-product

format:
  aspect: "16:9"
  fps: 30
  duration_s: 37.933
  orientation: horizontal

verdict: >
  Jitter selling its own AI feature by literally showing the chat command and the
  canvas obeying it in real time — dots snapping into a ring, a poster regrowing
  across five aspect ratios at once, a style picker warping the artwork live.
  Every synthetic cursor carries a name tag, which turns anonymous UI demos into
  "a real person just did this," and the one genuinely novel visual (a countdown
  numeral inside a pulsing circular halftone halo) proves the mask can be the
  hero object, not just a reveal device.

palette:
  bg: "#F0F0F0"
  ink: "#101010"
  accent: "#18A8F0"
  support: ["#D8D8F0", "#F0F000", "#7C4DFF", "#F0409C"]
  notes: >
    Two base modes alternate rather than blend: a light near-white UI chrome
    (#F0F0F0 / #D8D8F0) for headline and template beats, and pure black
    (#000000, 24% of total screen time) for every canvas/agent-chat beat. Cyan
    accent (#18A8F0) is rationed to the product's own bot icon and one wordmark
    colour-flash. Purple (~#7C4DFF) marks AI-agent chat bubbles and cursor tags.
    Magenta and yellow each appear on exactly one hero object each (the
    "Superagents" colour-cycle and the "SUMMER SALE" campaign) — never mixed
    into the same frame as an accent.

typography:
  family_look: geometric sans
  weights: [bold, black]
  case: mixed
  tracking: tight
  headline_frame_share: 0.4
  notes: >
    Wordmark and hero headlines ("Meet", "Jitter", "Superagents", "WE ARE
    HIRING. SENIOR DESIGNER.") run in one heavy geometric sans at 35-45% of
    frame width. All in-app UI copy (chat bubbles, layer names, tooltips) drops
    to a much smaller regular-weight version of the same family at
    roughly 12-16px equivalent, sentence case throughout.

structure:
  - act: hook
    t: [0.0, 6.95]
    purpose: >
      Land the product name through a fast word-swap, then run one full
      "remix a template" demo end to end so the payoff (a finished on-brand
      poster) appears before the six-second mark.
    shots: [1, 2, 3, 4]
  - act: capability
    t: [6.95, 17.45]
    purpose: >
      Show two more agent actions living inside a floating product window:
      a physics/layout command (ellipses into a ring, then gravity) and a
      style-transfer command (displacement shaders), ending on the single
      most ornamental shot in the video (the halftone counter).
    shots: [5, 6, 7, 8]
  - act: capability
    t: [17.45, 26.65]
    purpose: >
      Stage the headline claim "scale one asset into a full campaign" word by
      word, then prove it literally with a Magic Resize action that regrows
      one poster across five aspect ratios and a live translate command.
    shots: [9, 10, 11, 12]
  - act: proof
    t: [26.65, 31.6]
    purpose: >
      Show the AI output at volume — a diagonal cascade of translated
      variants, then a wall of roughly 120 generated tiles with an export
      action — to make "bulk" a visible fact, not a claim.
    shots: [13, 14, 15]
  - act: cta
    t: [31.6, 37.933]
    purpose: Logo lockup, tagline, and a colour-cycling CTA pill held to black.
    shots: [16, 17]

