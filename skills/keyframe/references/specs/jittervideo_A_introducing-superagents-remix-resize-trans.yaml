techniques:
  - id: ai-chat-canvas-morph
    what: >
      A visible AI chat panel receives a plain-English instruction
      ("Distribute ellipse layers evenly...", "Animate all ellipses so they
      fall down with gravity...") and the canvas responds by physically
      rearranging its objects — scattered dots snapping into an
      evenly-spaced ring, then that ring dropping and bouncing under
      gravity — with a "Done — ..." confirmation line appearing after each
      result lands.
    where: shot 6, frames 276-401
    why_it_reads: >
      Watching an instruction turn directly into a canvas state-change,
      with the chat log as the receipt, sells "the tool understands intent"
      far more convincingly than a voiceover claim could. It is the
      clearest UI-as-hero demonstration in the whole reference.
    remotion_recipe: >
      Precompute two or three named object-position arrays: scatterPositions
      (random), ringPositions (polar coordinates, x=r*cos(theta),
      y=r*sin(theta) around a shared centre), bouncePositions (a simple
      gravity + restitution simulation baked to per-frame y-offsets for each
      dot). For the currently-active instruction, interpolate each dot's
      x/y between whichever two position arrays bound the current frame
      range using an expoInOut ease. Render the chat log as a scrolling
      flex column of bubbles revealed with springSoft (y + opacity), and
      gate each "Done" bubble to fire only once its corresponding canvas
      animation's frame range has completed.
    difficulty: moderate

  - id: displacement-style-picker-grid
    what: >
      A side panel shows named effect thumbnails (Fluid Warp, Fluted Glass,
      Bulge, Displacement, Noise Warp, Ripple, Post FX) two at a time; as
      the AI applies each, the live canvas artwork visibly warps to match.
    where: shot 7, frames 401-464
    why_it_reads: >
      Naming the effect in text right beside its live preview turns an
      abstract "apply an effect" claim into a mapped, concrete visual
      result — PRINCIPLES' "abstract claim gets one concrete visual object"
      rule, executed twice per second.
    remotion_recipe: >
      Apply an SVG feDisplacementMap filter (or a WebGL fragment shader
      sampling a displacement texture) to the artwork layer, driving the
      map's scale/frequency uniform from 0 to a target value over 8-10f per
      applied effect. Swap the underlying displacement texture (fine noise
      for Noise Warp, a radial gradient for Bulge, a sine-wave pattern for
      Ripple) per named effect rather than trying to build one universal
      shader that fakes all of them.
    difficulty: hard

  - id: radial-halftone-counter-halo
    what: >
      A large countdown numeral sits inside a circular field of small dots
      whose density/opacity radiates outward from the number, giving it a
      glowing, textured halo in place of a flat drop shadow.
    where: shot 8, frames 464-524
    why_it_reads: >
      The mask/texture is the subject here, not a reveal device — it makes
      one numeral feel like the centre of an energy field, which is
      exactly the register a "starting soon" countdown needs. Direct
      answer to the shape-driven-masking brief: the mask boundary is a
      circle, the fill is animated, and nothing is being "revealed" by it.
    remotion_recipe: >
      Generate an SVG pattern of small circles on a grid; clip it to a disc
      with clip-path: circle(38% at 50% 50%) (radius_pct=38 of the
      containing box). Drive each dot's opacity/radius as a function of its
      distance from the centre plus a per-frame sine term
      (Math.sin(frame / period_f + distance * k)) so the halo visibly
      pulses in sync with the counter, entirely from useCurrentFrame() —
      no video texture or pre-baked asset needed.
    difficulty: moderate

  - id: sentence-build-word-append
    what: >
      A headline is built by appending one or more NEW words per beat while
      all previously-landed words stay in place, ending on a full sentence
      with the final word in an accent colour. Distinct from letter-by-letter
      typing and from suffix-growth of a single word.
    where: shots 5 and 9, frames 209-276 and 524-580
    why_it_reads: >
      Matches PRINCIPLES' "never put a full sentence on screen at once,
      stage it" almost exactly — each beat gives the eye one new idea
      instead of a wall of text, and the accent colour on the last word
      rewards reaching the end of the claim.
    remotion_recipe: >
      Store the full sentence as an array of word-groups, e.g.
      ["WE", "ARE HIRING.", "SENIOR", "DESIGNER."]. currentGroup =
      Math.floor((frame - startF) / durPerGroupF). Render
      groups.slice(0, currentGroup + 1).join(' '), with the newest group's
      opacity animated 0 to 1 over 4-6f paired with a 6px y-rise so each
      addition still reads as a small entrance rather than a bare cross-fade.
    difficulty: trivial

  - id: magic-resize-live-reflow
    what: >
      Selecting "Magic Resize" from a context menu triggers the same
      asset's headline and photo to simultaneously regrow and reflow across
      several differently-cropped aspect-ratio variants in parallel, rather
      than resizing a static screenshot.
    where: shots 10-11, frames 580-688
    why_it_reads: >
      This is PRINCIPLES' "animate the UI's own state changes... rather
      than animating the screenshot as one image" in its purest form — the
      payoff (one asset becomes a full campaign) is a real, simultaneous
      multi-artboard transformation, not an implied cut.
    remotion_recipe: >
      Keep one canonical content model (headline string, photo focal-point
      rect) and N artboard components that each map that model to their own
      aspect ratio via CSS aspect-ratio plus object-fit: cover with a
      per-artboard focal point. Drive all N artboards' text-reveal off the
      same shared frame counter so they visibly grow in lockstep, and
      stagger only their entrance (x/opacity, 3-4f apart) so the group reads
      as one action fanning out, not N separate animations.
    difficulty: moderate

  - id: multiplayer-cursor-name-tags
    what: >
      Every synthetic cursor carries a small pill-shaped name tag (a
      colour-coded chip plus first name — Sacha, Thomas, Louisa, Patrick,
      Anais) that travels with the pointer and attaches to whichever UI
      action it performs.
    where: shots 2, 6, 10, 15
    why_it_reads: >
      Reframes every cursor move as "a real collaborator doing this live"
      instead of an anonymous demo pointer, implying a whole team/workflow
      without ever showing a face.
    remotion_recipe: >
      A single Cursor component composed of an SVG arrow plus an
      absolutely-positioned label div (border-radius: 999px, background:
      the cursor's assigned colour) offset (18px, 18px) from the arrow tip.
      Interpolate position between keyframed (x, y) waypoints per shot with
      an expoOut ease; fire a springSnap scale pulse (1 to 0.85 to 1, 6f) on
      any frame flagged as a click.
    difficulty: trivial

  - id: diagonal-cascade-array
    what: >
      A set of related variant cards (the same poster translated into ten
      languages) fly in and land staggered along a descending diagonal,
      each offset down-and-left and slightly smaller than the last, rather
      than in a grid or a straight stack.
    where: shot 13, frames 800-823
    why_it_reads: >
      A diagonal arrangement reads as "many parallel outputs from one
      source" more legibly than a grid at this small a scale — the
      staircase implies both quantity and an implicit order without
      labelling either.
    remotion_recipe: >
      For card index i: targetX = -i * dxStep, targetY = i * dyStep (both
      px; dxStep negative/left, dyStep positive/down), scale = 1 - i * 0.03.
      Animate each card in from an offset start position (targetX + 120,
      targetY - 120) with opacity 0 to 1 and a backOut ease, staggering the
      start frame by 2f per index — pure index-driven math, no per-card
      hand placement.
    difficulty: trivial

  - id: bulk-variant-tile-wall
    what: >
      A single AI instruction resolves into a dense wall of roughly 120
      small square video-tile thumbnails filling the entire frame, followed
      by a one-line "Export 120 videos" action.
    where: shots 14-15, frames 823-948
    why_it_reads: >
      Scale becomes the visual — the video never claims "generate at
      scale" in words, it shows an uncountable grid and lets the "120" in
      the export button retroactively confirm the count.
    remotion_recipe: >
      Render an MxN CSS grid of tile components, each a cheap placeholder
      (a single looping background clip with a caption drawn from a small
      array of localized strings, indexed by (row * N + col) modulo
      array.length so only a handful of unique assets fill 120 slots).
      Populate the grid with one staggerRise pass at a tight 1f per-tile
      stagger — at that rate it reads as instant population, not a slow
      reveal.
    difficulty: moderate

rhythm:
  cut_count: 16
  median_shot_f: 66
  fastest_f: 9
  slowest_f: 125
  pattern: >
    9f cold-open flash ("Meet") -> 81f wordmark/prompt/carousel hook ->
    three 43-76f "remix payoff" beats -> a 67-125f pair of AI-chat-driven
    canvas demos (ellipses, displacement shader) -> a 60f ornamental
    counter-halo beat -> two 42-112f "sentence assembles + Magic Resize"
    beats -> a 23-108f bulk-proof pair (diagonal cascade, tile wall) -> a
    72f logo lockup -> a 118f colour-cycling CTA hold. Energy is
    front-loaded at the hook, dips to a steady medium through the two long
    UI-demo shots, and never fully re-accelerates before the long outro
    hold.
  beat_grid_f: null
  energy_curve: wave

transferable:
  - Steal ai-chat-canvas-morph as the default explainer beat for any
    AI-powered feature — show the instruction and the canvas obeying it,
    never voiceover the claim instead.
  - Use sentence-build-word-append instead of typeOn for any claim longer
    than about six words; it stages the sentence without a caret cliche.
  - Give every synthetic cursor a name tag (multiplayer-cursor-name-tags) —
    it is a single component and implies a whole team for free.
  - Use magic-resize-live-reflow (one content model, N aspect-ratio
    artboards driven off a shared frame counter) for any "one input, many
    outputs" feature instead of showing outputs as static side-by-side
    screenshots.
  - Use diagonal-cascade-array in place of a plain grid stagger whenever
    showing several parallel variants of one source asset.
  - Reserve one ornamental mask-as-subject moment per video (here,
    radial-halftone-counter-halo) rather than spreading shape-masking
    thinly across many shots.

avoid:
  - The 125f screen-recording montage in shot 6 depends on a real,
    hand-scripted product session (an actual AI response). Don't fake
    per-token "AI thinking" timing by hand-keying it — script the full
    response text up front and drive its reveal purely from frame math
    (typeOn / sentenceBuildCascade), exactly as every other text beat in
    this spec already does.
  - The style-picker's Fluid Warp/Bulge effects are genuine GPU shader
    passes (feDisplacementMap or WebGL), not CSS filters — don't
    approximate them with blur/hue-rotate; use a real displacement shader
    or drop that specific beat if the pipeline has no WebGL layer.
  - The 120-tile wall implies 120 unique renders. Don't actually render 120
    distinct Remotion comps — reuse a small placeholder set indexed
    modulo array length, per bulk-variant-tile-wall.
  - The final 0.7s of the video (last ~59f of shot 17, after the CTA pill's
    colour-cycle settles) is a genuinely dead, fully static hold — a bug per
    PRINCIPLES section 12, not a deliberate choice. Fix with a tiny
    breathe/gradientDrift that keeps running after the colour settles.

new_moves:
  - name: sentenceBuildCascade
    params: {word_groups: 6, dur_per_group_f: 9, transition: hardCut, ease: expoOut, accent_last_word: true}
    description: >
      A sentence is assembled by appending one or more whole new words per
      beat while previously-landed words remain static, rather than typing
      character-by-character (typeOn) or growing one word's suffix
      (wordBuildReveal). Each new word-group's opacity animates 0 to 1 over
      4-6f paired with a small y-rise so the addition reads as an entrance,
      not a cross-fade. Optionally colour the final word-group as an accent
      to mark the sentence's completion.
  - name: radialHalftoneMask
    params: {radius_pct: 38, dot_grid: "24x24", pulse_period_f: 30, dot_opacity: [0.15, 0.9]}
    description: >
      A field of small repeated shapes (dots) arranged on a grid and hard
      clipped to a circular (or other) boundary around a hero element,
      where the dot pattern itself is the visual subject rather than a
      wipe/reveal device. Dot opacity/scale is driven by distance from
      centre plus a per-frame sine term so the whole halo pulses in place.
  - name: cursorNameTagChoreo
    params: {dur_f: 20, click_ripple: true, per_target_stagger_f: 8}
    description: >
      A synthetic cursor (arrow + offset pill-shaped name tag) is animated
      along keyframed waypoints to simulate a named collaborator performing
      UI actions. Optionally fires a springSnap scale-pulse "click ripple"
      when it reaches an interactive target, and can visit multiple targets
      in sequence with per_target_stagger_f between arrivals.
  - name: diagonalCascadeIn
    params: {dx: -90px, dy: 60px, stagger_f: 2, scale_falloff: 0.03, ease: backOut}
    description: >
      An index-driven variant of slideStackIn where each successive item is
      offset along BOTH x and y (dx, dy per index) rather than pure y,
      producing a descending diagonal staircase instead of a vertical stack
      or a grid. scale_falloff shrinks each successive item slightly to
      reinforce depth/order.

detection_notes: >
  Source video is 60fps (2276 frames / 37.933s) but this spec normalizes
  every frame count to the pipeline's 30fps convention per MOVE_VOCAB.md —
  all `t:` seconds match profile.md exactly, and `frames:` values here are
  the source's native frame numbers divided by two. One merge was made
  against the profile's 18-cut shot table: source frames 1600-1607 (8f at
  60fps = 0.13s, tagged "hot / linear" in profile.md) sit below the 11f
  minimum-shot-length rule and are a cut-detector artifact at the join
  between the diagonal-cascade landing and the "Artboard" chat command
  beginning, not a real shot — folded into shot 14 (source frames
  1608-1646) here. No other shots were merged; the remaining 16
  profile-detected cuts each correspond to a real, visually distinct
  content change confirmed on the sheets. The profile's flagged frozen
  stretch (source frames 2233-2275, ≈ frames 1117-1138 here) is confirmed
  genuine dead time after the CTA pill's colour-cycle settles — flagged
  under `avoid`, not merged away, since it is a real bug rather than a
  detection error.

convergence:
  - >
    wordCycleSettle / word-cycle-slot-settle (Zhylar spec, shot 4): both
    reveal a headline identity by substituting whole words into a fixed
    text slot on a frame-indexed timer rather than typing or cutting to it
    — here "Meet" -> "Jitter" -> "Superagents" (shot 2), there a 3-column
    slot machine landing on a value prop.
  - >
    wordBuildReveal / word-build-suffix-reveal (Zhylar spec, shot 14): both
    stage a short claim by progressively growing visible text rather than
    typing it character-by-character or cutting to it whole — here the
    "SUM" -> "SUMMER SALE" letter growth (shot 11) and the whole-word
    sentence-build-word-append beats (shots 5, 9); there the "Simplify
    Pro" -> "Simplify Processes" suffix growth with a redrawing underline.
  - >
    driftCamera / pushIn as the default ambient move on floating UI and
    hero-object shots: both specs run a near-imperceptible camera drift or
    slow push on almost every shot rather than ever holding the frame
    perfectly static.
  - >
    dropShadowSoft on floating UI cards/panels: both specs consistently
    treat any UI mockup or floating card with a single soft drop shadow to
    read as "physically placed" rather than pasted flat.
