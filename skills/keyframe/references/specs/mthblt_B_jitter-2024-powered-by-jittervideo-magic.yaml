techniques:
  - id: self-demonstrating-preset-names
    what: >
      Instead of describing a text-animation preset, the reel names it and makes the word
      perform the effect on itself — "SWOOSH" gets a motion-trail, "POP" is revealed by a
      bubble popping, "BLUR" resolves from heavy blur to sharp, "MOOOOOOOOOOOOTH" (smooth,
      stretched) gets an extreme elastic squash-stretch. Four separate capability beats, one
      reusable pattern.
    where: shots 9, 32, 33, 34
    why_it_reads: >
      Zero abstraction gap between claim and proof — the viewer never has to imagine what
      the preset looks like, because the label IS the demo. This is the single highest-value,
      most-copyable idea in the whole reference for any tool/feature reel.
    remotion_recipe: >
      Build one <PresetDemoWord name="SWOOSH" effect="motionTrail" /> component whose
      `effect` prop switches which transform/filter function is applied to its own text
      node — motionTrail duplicates the text 3x with staggered opacity/offset, blur applies
      an animated CSS filter:blur(), pop wraps the text in an SVG circle mask whose r animates
      then snaps to 0. Reuse the same component and swap only the word + effect prop per shot.
    difficulty: moderate

  - id: irregular-polygon-shape-wipe
    what: >
      A jet-black irregular 7-sided polygon (not a rectangle, not a circle) grows to cover
      the entire frame in 4f, holds 3f with a small paper-plane icon centred as the only
      visible shape, then recedes to white — a scene transition where the wipe shape itself
      is the visual event, not a straight-edge clip-path.
    where: shot 4
    why_it_reads: >
      A rectangular wipe reads as a slide transition; an irregular angular polygon reads as
      a deliberate brand mark (echoes the "torn paper" / "cut shape" language used elsewhere
      in the reel) while still functioning as a full-coverage mask.
    remotion_recipe: >
      Define the polygon as an SVG <clipPath> with a fixed odd-vertex point list (e.g. 7
      points at irregular radii from centre, precomputed once). Animate the clip-path's
      `transform: scale()` from 0 to a value large enough to cover the frame diagonal
      (~1.5x max dimension), transform-origin at the polygon's centroid, expoInOut ease. On
      the receding half, either reverse the scale or crossfade to a second differently-shaped
      polygon clip-path to avoid the wipe looking mechanically symmetric.
    difficulty: moderate

  - id: blob-mask-becomes-subject
    what: >
      A rounded superellipse/blob shape slides in and settles centred over the headline
      "Try it for free", covering roughly 55% of frame width. For a few frames the text is
      visible cut into the blob's fill; then the blob's own flat color becomes the dominant
      visual and the text reads as sitting on top of it — the mask transitions from "revealing
      device" to "background shape" without a hard cut.
    where: shot 13
    why_it_reads: >
      Most masked reveals discard the mask once the reveal completes. Keeping it on screen as
      a background element instead of cutting it away reads as one continuous idea rather
      than a wipe-then-forget effect.
    remotion_recipe: >
      Render the blob as an absolutely-positioned <div> with border-radius set via a
      superellipse/squircle CSS approximation (or an inline SVG <path> with a fixed blob
      path). Animate translateX from -30% to 0 (expoOut, ~12f). Do NOT clip the text through
      the blob with mix-blend-mode trickery — simplest and most robust is to z-index the text
      ABOVE the blob from frame 0, so the blob visually "arrives under" the text rather than
      needing a real mask; reserve true mask-image only if the brief specifically needs the
      text cut BY the blob's edge.
    difficulty: trivial

  - id: venetian-blind-strip-reveal
    what: >
      4 vertical rectangular strips, alternating a small (~15% of frame height) vertical
      offset top/bottom, slide open from a closed seam to reveal a full-bleed video thumbnail
      underneath, staggered ~2f apart, expoInOut.
    where: shot 14
    why_it_reads: >
      A single wipe reveals content in one direction; alternating-offset strips reveal it in
      pieces that resolve almost simultaneously, reading as more mechanical/premium (blinds,
      shutter) than a single clip-path inset ever could.
    remotion_recipe: >
      Split the reveal image into N equal vertical <div> slices, each with
      overflow:hidden and the full image inside translated to align (background-position
      trick, or a shared absolutely-positioned image with each slice's clip-path: inset()
      restricting to its own column). Animate each slice's own translateY — even slices
      -15%→0, odd slices +15%→0 — with stagger_f 2 between slices, expoInOut, so they land
      at very slightly different times but converge fast.
    difficulty: moderate

  - id: bubble-pop-reveal
    what: >
      A translucent iridescent bubble (~18% of frame width) grows over 6f centred on the
      headline "POP", then pops/vanishes in 2f — that pop event is the trigger that snaps the
      letterforms beneath it to full opacity, i.e. the mask's destruction IS the reveal.
    where: shot 33
    why_it_reads: >
      Inverts the usual mask logic (mask shrinks to reveal) — here the mask GROWS then
      violently disappears, which reads as a pop/snap rather than a wipe, matching the word
      on screen exactly.
    remotion_recipe: >
      Render an SVG circle with a radial-gradient fill (white-to-transparent, plus a thin
      lighter rim stroke to sell "bubble") whose r animates 0→1 over 6f (springSoft). On the
      pop frame, don't shrink it back to 0 — instead crossfade its opacity to 0 over 2f while
      simultaneously scaling it up 1.3x (bubbles pop by expanding-then-vanishing, not
      shrinking). The text underneath is present at full opacity the entire time; the bubble
      merely occludes it until it's gone.
    difficulty: trivial

  - id: linear-velocity-corner-peel
    what: >
      A single 50-frame transition where a textured tile peels back from one corner at
      constant (non-eased) velocity, revealing a branded layer underneath — profile.md
      explicitly classifies this shot's velocity profile as "linear/constant", the one
      deliberate break from the reel's otherwise-universal easing.
    where: shot 16
    why_it_reads: >
      A page-peel is a physical, mechanical action (like a page turning at a fixed reading
      speed) rather than an accelerating UI element, so linear velocity reads as correct
      here rather than as the "amateur tell" it would be on a UI card entrance.
    remotion_recipe: >
      Use a CSS 3D transform on a triangular clip-path segment (the "peeling corner"):
      transform-origin at the opposite corner, rotateY/rotateX driven linearly (no easing
      function, straight interpolate(frame, [0,50], [0,180])) with perspective on the parent.
      Add a soft drop-shadow under the peeling corner that grows as it lifts, to sell
      thickness. This is the one place in the whole spec where `ease: linear` on a transform
      is correct per MOVE_VOCAB's stated exception for mechanical/physical motion.
    difficulty: hard

  - id: cursor-follows-curved-path
    what: >
      A circular guide ring draws on around the words "Curved paths", and the small
      paper-plane cursor icon that recurs throughout the reel travels along the ring's
      circumference (a 60° arc) instead of in a straight line — literally demonstrating the
      path-follow animation feature by making the video's own recurring cursor motif use it.
    where: shot 27
    why_it_reads: >
      The cursor icon has already taught the viewer "this is how things move" via straight
      whip-pans in earlier shots (shot 5); bending its motion onto a circle here is a payoff,
      not a new idea.
    remotion_recipe: >
      Parametrize position as x = cx + r*cos(θ), y = cy + r*sin(θ), animate θ over the arc
      range (e.g. 200°→260°) with expoInOut via interpolate(frame,...). Draw the guide ring
      itself as an SVG <circle> with strokeDashoffset animating 1→0 for the draw-on. Keep the
      cursor icon's own rotation locked tangent to the path (rotate = θ + 90°) so it reads as
      "flying along" rather than sliding sideways.
    difficulty: moderate

  - id: keyframe-marker-percent-sync
    what: >
      A small square keyframe marker slides along a horizontal timeline while a percentage
      counter beside it climbs in exact lockstep (0%→9%) — one value drives both the marker's
      x-position and the counter's displayed number.
    where: shot 30
    why_it_reads: >
      A counter ticking up on its own reads as decoration; tying it to a marker's literal
      screen position makes the number legible as "where we are on the timeline", which is
      exactly the feature (a keyframe/progress scrubber) being sold.
    remotion_recipe: >
      Derive a single progress value p = interpolate(frame,[0,24],[0,1],{easing:Easing.out}).
      Drive the marker's left:`${p*52}%` and the counter's displayed integer from the same p
      (Math.round(p*9)) — never animate the two off separate timers, or they will visibly
      drift out of sync on any future duration change.
    difficulty: trivial

  - id: scramble-to-order-title
    what: >
      "CREATOR TOOLS AWARDS" enters with its own letters visibly jumbled/out of reading order
      for ~4 frames before snapping into the correct sequence — a kinetic-type moment used
      exactly once, per MOVE_VOCAB's "one per-letter moment per video" rule.
    where: shot 26
    why_it_reads: >
      A plain fade-in for an awards-title card is the flattest possible choice; letters
      visibly reordering themselves signals "assembled live" and buys a half-second of
      genuine surprise for very little rendering cost.
    remotion_recipe: >
      Precompute a fixed pseudo-random permutation of letter x-offsets (seeded by letter
      index, not Math.random()) for frame 0, then interpolate each letter's x from its
      scrambled offset to its correct in-line position over ~10f with a slight stagger
      per letter (1-2f), backOut easing so letters overshoot slightly as they land in place.
    difficulty: moderate

  - id: capability-chip-grid-stagger
    what: >
      Small square/rectangular feature chips (New / Animate together / Live collaboration /
      Multiplayer timeline) stagger into a loose grid beside a hero UI panel, 4f apart,
      springSoft.
    where: shots 6, 25
    why_it_reads: >
      Groups several one-word capability claims into a single readable beat instead of a
      separate shot per feature, keeping the edit's pace up without losing legibility.
    remotion_recipe: >
      Absolutely-position each chip at its final grid coordinate from frame 0; animate only
      opacity 0→1 and translateY 24→0 per chip with stagger_f driven by array index times a
      constant (4f), springSoft. Do not reflow layout during the animation — chips must not
      move each other.
    difficulty: trivial

rhythm:
  cut_count: 43
  median_shot_f: 20
  fastest_f: 4
  slowest_f: 73
  pattern: >
    Fast, front-loaded hook (4 cuts in 45f) into a long dense capability-demo midsection
    (median cut ~20f) with one hard 17f strobe-whip cluster around the two-thirds mark
    (frames 208-224), a 53f longest single shot mid-reel (folder/team UI, frames 598-650),
    then a 73f multi-beat outro (frames 927-999) that itself contains 5 internal sub-beats
    (Swoosh/Pop/Blur/Now-available/CTA) the automated cut-detector did not split, because
    each sub-beat is a soft dissolve rather than a hard luma-delta cut.
  beat_grid_f: 0
  energy_curve: wave

detection_notes: >
  profile.md lists frames 208-213, 214-217 and 218-224 as three separate shots (6f, 4f, 7f,
  all "hot" energy). Cross-checked against sheet_02/sheet_03 content and the motion.csv
  spike at f207 (60.9) and f224 (131.4): this is one continuous whip-zoom/strobe transition
  from the Product-Hunt award card into the "MOOOOOOOOOOOOTH" elastic-text card, not three
  independently readable shots — merged into spec shot 8 as a single zoomBlurCut/whipPan
  cluster (17f total, still above the 11f minimum as a unit). Conversely, profile.md shows
  frames 927-999 (73f) as ONE shot, but the content visibly changes background and subject
  five times in that range (SWOOSH purple bg → POP light-blue bg → BLUR black bg → "Now
  available." → jitter.video CTA) per sheet_06 — the automated detector missed these cuts
  because each is a soft dissolve rather than a hard luma spike. Split into spec shots
  32-35 accordingly, with frame boundaries estimated proportionally from sheet cell density
  since no individual cut-delta values exist to pin them exactly.

transferable:
  - >
    Make the on-screen WORD perform the effect it names (Swoosh/Pop/Blur/Smooth) instead of
    describing the effect in a caption — zero-abstraction-gap capability demos.
  - >
    Keep a recurring cursor/pointer motif (the paper-plane icon) traveling in a straight line
    in early shots, then bend its path onto a circle later as a payoff for the same visual
    element, instead of introducing path-following with a brand-new object.
  - >
    Use linear (non-eased) velocity deliberately for exactly one shot type: a physical,
    mechanical action like a page/corner peel, where constant speed reads as correct rather
    than robotic.
  - >
    Drive a percentage counter and a position-based UI element (slider, keyframe marker) off
    the SAME progress variable rather than two separately timed animations, so they cannot
    visibly drift apart.
  - >
    When a mask reveal finishes, consider leaving the mask shape on screen as a background
    element rather than cutting it away — it reads as one continuous idea instead of a
    wipe-then-forget trick.
  - >
    For a feature-dense product reel, let 3-4 shots run under the 11f minimum as a single
    deliberate strobe/whip-pan cluster between two calmer shots, rather than trying to make
    each frame count individually readable.

avoid:
  - >
    Hand-drawing or rotoscoping the scramble-to-order title letters frame by frame; use a
    fixed pseudo-random seeded offset array and interpolate each letter's position with a
    slight stagger, backOut easing.
  - >
    Keyframing the venetian-blind strip reveal by manually animating each strip in an NLE;
    split the source image into N CSS-clipped slices sharing one background layer and drive
    each slice's translateY off a shared stagger function.
  - >
    Building the bubble-pop reveal as a pre-rendered video asset; it is a single SVG radial-
    gradient circle animated in code, cheaper to tune and to re-time than a baked clip.

new_moves:
  - name: shapeWipeTransition
    params: {shape: irregular_polygon, vertices: 7, dur_f: 8, hold_f: 3, ease: expoInOut}
    description: >
      A non-rectangular polygon shape (fixed odd-vertex point list) scales from 0 to full-
      frame coverage as a clip-path/mask, holds briefly at full coverage, then recedes or
      crossfades to reveal the next scene — a scene-transition wipe where the wipe shape
      itself is the visual event rather than a straight edge.
  - name: blobMaskReveal
    params: {shape: superellipse, coverage_pct: 55, translateX_pct: [-30, 0], dur_f: 12, ease: expoOut}
    description: >
      A rounded blob/superellipse slides in to settle over a headline, transitioning from
      "revealing mask" to "background shape" without being discarded — the mask persists as
      set dressing after its reveal function completes.
  - name: venetianBlindWipe
    params: {strip_count: 4, strip_offset_pct: 15, dur_f: 20, stagger_f: 2, ease: expoInOut}
    description: >
      N vertical strips of a full-bleed image, alternating a small vertical offset top/bottom,
      slide closed-to-open with a small per-strip stagger to reveal the image beneath, reading
      as a shutter/blinds mechanism rather than a single wipe direction.
  - name: bubblePopReveal
    params: {bubble_radius_pct: 18, grow_dur_f: 6, pop_dur_f: 2, ease: expoOut}
    description: >
      A translucent circular "bubble" (radial-gradient fill, thin rim highlight) grows over a
      headline then expands-and-vanishes (not shrinks) in a short pop, with the text beneath
      present at full opacity throughout — the bubble's destruction is the reveal trigger.
  - name: cornerPeelWipe
    params: {corner: top-right, peel_angle_deg: 35, dur_f: 50, ease: linear}
    description: >
      A triangular corner segment of the current frame lifts via 3D rotateX/rotateY at
      constant (linear) velocity, transform-origin at the opposite corner, revealing the next
      layer underneath — used for a page-turn/physical-peel feel where linear velocity is
      correct rather than an easing-rule violation.
  - name: orbitAlongPath
    params: {path: circle, radius_pct_of_frame: 32, arc_deg: [200, 260], dur_f: 14, ease: expoInOut}
    description: >
      An element's position is parametrized in polar coordinates around a defined path
      (circle here, but generalizes to any SVG path via getPointAtLength) rather than moving
      linearly between two points, with rotation locked tangent to the path direction.
  - name: keyframeScrubSync
    params: {x_pct: [3, 55], percent: [0, 9], dur_f: 24, ease: expoOut, monospace_digits: true}
    description: >
      A position value (marker x) and a displayed number (percent counter) are both derived
      from one shared progress variable rather than independently timed, guaranteeing they
      never visually drift apart regardless of later duration edits.
  - name: elasticStretchIn
    params: {scaleX: [0.3, 1.25, 1], dur_f: 14, ease: springSnap, overshoot_pct: 20}
    description: >
      A headline scales in on X only (not uniform scale) with an exaggerated spring overshoot
      (15-25%, well above the standard 3-6% overshoot law), used exactly once to visually
      demonstrate an "elastic" easing preset by applying it to the preset's own name.
  - name: scrambleToOrder
    params: {jumble_f: 4, dur_f: 14, ease: expoOut}
    description: >
      Letters of a title start at fixed pseudo-random (seeded, not Math.random) offset
      positions and interpolate to their correct in-line position with a slight per-letter
      stagger and backOut overshoot, reading as letters "finding their place" rather than a
      plain fade or mask reveal.
  - name: motionTrailTextIn
    params: {echoes: 3, offset_px: [10, 6], opacity: [0.3, 0.6, 1], dur_f: 10, ease: expoOut}
    description: >
      A word's own drop-shadow/duplicate copies offset diagonally into a trailing stack as
      it settles into place, at increasing opacity toward the final frontmost copy — used to
      make a word visually perform a "swoosh"/motion-trail preset on itself.
  - name: styleSwapTilt
    params: {skew_deg: [0, -8], dur_f: 14, ease: expoInOut}
    description: >
      A settled headline transitions into an italic/kinetic variant by animating CSS skew on
      the whole text block, used to demonstrate a "style preset" swap without re-triggering
      a full entrance animation.
  - name: boomerangWobble
    params: {rotate_deg: [-2, 2, -2], period_f: 34, ease: springSoft, overshoot_pct: 5}
    description: >
      A photo/card element rocks a few degrees forward then back on a fixed period with a
      small spring overshoot at each direction change, implying a boomerang/ping-pong replay
      without actually needing a reversed video asset.

convergence:
  - >
    Capability-chip/card stagger entrances (springSoft, 3-4f stagger, translateY 20-28px) —
    matches the byshubh_ corpus's staggerRise/slideStackIn pattern for card grids closely
    enough to be confident this is a shared, not coincidental, technique.
  - >
    Floating UI panels with a single soft drop-shadow (dropShadowSoft) and no competing
    shadow layers, appearing throughout both this reference and the byshubh_ example spec's
    stat-card dashboard.
  - >
    springSoft/springSnap easing reserved for physical UI objects (panels, cards, badges)
    while bezier/expo easing is reserved for text and camera — the same easing-family
    discipline documented in the byshubh_ example's isometric-dashboard technique.
  - >
    A counter value tied to something other than a fixed timer (here, a slider/marker
    position; in the byshubh_ corpus, a content-reveal-progress fraction) — same underlying
    principle of driving numeric displays off real state rather than wall-clock time.
