id: mthblt_B_jitter-2024-powered-by-jittervideo-magic
source: https://x.com/mthblt/status/jitter-2024-powered-by-jittervideo-magic
category: ui-showcase
product_type: visual-product

format:
  aspect: "16:10"
  fps: 30
  duration_s: 33.4
  orientation: horizontal

verdict: >
  A 43-cut, 1000-frame product reel that never lets a capability sit still for more than
  ~1.3s: every UI feature (curved paths, easing curves, gradients, keyframe scrubbing) is
  demonstrated by making the ON-SCREEN WORD PERFORM ITS OWN EFFECT, and every scene
  transition is a genuine masking trick (blob wipe, venetian-blind strips, bubble pop, paper
  fold) rather than a hard cut or cross-dissolve. It is the strongest shape-masking and
  self-demonstrating-typography reference in the batch.

palette:
  bg: "#000000"
  ink: "#F0F0F0"
  accent: "#29A9FF"
  support: ["#6E4FFF", "#D8D8D8", "#90C0D8"]
  notes: >
    Scene backgrounds alternate hard between pure black (transitions, outro) and flat
    light-gray/white UI-panel cards (#F0F0F0/#D8D8D8) — almost no mid-gray. Jitter's brand
    blue #29A9FF (read directly off the on-screen color-picker swatch) is the single
    recurring accent across UI chrome, badges and the curved-path scene. Purple
    (#6E4FFF-ish) is reserved for two beats only — the "New" feature badge and the
    Product-Hunt "Design tool of the year" award scene — a textbook accent-rationing case.
    The final CTA pill breaks the whole-video palette rule on purpose: it cycles
    green→yellow→pink→purple→blue as a one-time "look how many colors this tool can do"
    flourish on the very last shot.

typography:
  family_look: geometric sans
  weights: [medium, bold]
  case: mixed
  tracking: tight
  headline_frame_share: 0.5
  notes: >
    Two lines max, e.g. "Motion design / made simple", "Curved / paths". Scream-case
    (SWOOSH, POP, BLUR, MOOOOOOOOOOOOTH) is reserved for the outro capability names that
    perform their own effect — normal headlines stay sentence/mixed case.

structure:
  - act: hook
    t: [0.0, 1.53]
    purpose: brand-mark open, memoji avatar goes "live" to establish this is a real-time collaborative tool
    shots: [1, 2, 3, 4]
  - act: capability
    t: [1.53, 9.97]
    purpose: rapid-fire feature demos — import, text presets, style swap, live collaboration cards, award badge
    shots: [5, 6, 7, 8, 9, 10]
  - act: capability
    t: [6.93, 11.17]
    purpose: motion-editor internals — easing curve library, elastic spring stretch, bezier graph draw-on
    shots: [11, 12, 13, 14]
  - act: capability
    t: [9.07, 16.83]
    purpose: template gallery, masked reveals, and a folder/collaboration workflow
    shots: [15, 16, 17, 18, 19, 20, 21]
  - act: capability
    t: [15.77, 24.97]
    purpose: sharing, boomerang effect, Figma-Jitter integration lockup, teams feature, awards title
    shots: [22, 23, 24, 25, 26, 27]
  - act: capability
    t: [24.97, 29.63]
    purpose: curved-path animation feature, color/gradient editor, keyframe percentage scrubber, mobile stat card
    shots: [28, 29, 30, 31, 32]
  - act: cta
    t: [29.63, 33.4]
    purpose: capability names literally perform their own preset (Swoosh/Pop/Blur), then hold on the URL
    shots: [33, 34, 35, 36, 37]

shots:
  - n: 1
    t: [0.00, 0.90]
    frames: [0, 26]
    layout: centre-stack
    content: >
      Frame 0: "Welcome" on a light-blue gradient card. Frame ~4-14: second line "to Jitter"
      lands to complete "Welcome to Jitter", small dotted orbit-ring decoration settling
      bottom-centre. Frames 16-26: static hold on the completed lockup.
    moves:
      - move: maskWipeUp
        target: line_2_to_jitter
        at_f: 4
        params: {dur_f: 10, ease: expoOut}
      - move: drawOn
        target: bottom_orbit_ring_decoration
        at_f: 6
        params: {dur_f: 14, ease: expoInOut}
    camera: {move: driftCamera, params: {amp_pct: 0.4, period_f: 140, axes: xy}}
    bg: {kind: gradient-drift, moves: [gradientDrift]}
    treatment: []
    audio_cue: whoosh
    transition_out: {move: hardCut, params: {}}
    hold_f: 8

  - n: 2
    t: [0.90, 1.53]
    frames: [27, 45]
    layout: centre-stack
    content: >
      Hard cut to a 3D memoji avatar (purple beanie) inside a dotted confetti ring on black.
      8f later a "LIVE" pill badge pops onto the ring's edge, signalling real-time presence.
    moves:
      - move: popIn
        target: memoji_avatar
        at_f: 0
        params: {dur_f: 11, ease: springSnap}
      - move: popIn
        target: live_badge
        at_f: 11
        params: {scale: [0, 1.1, 1], dur_f: 8, ease: springSnap}
    camera: {move: driftCamera, params: {amp_pct: 0.5, period_f: 120, axes: xy}}
    bg: {kind: flat, moves: [grainShift]}
    treatment: [filmGrain]
    audio_cue: tick
    transition_out: {move: hardCut, params: {}}
    hold_f: 4

