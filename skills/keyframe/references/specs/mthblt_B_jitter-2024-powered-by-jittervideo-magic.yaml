    camera: {move: driftCamera, params: {amp_pct: 1.2, period_f: 60, axes: xy}}
    bg: {kind: flat, moves: [driftCamera]}
    treatment: [dropShadowSoft]
    audio_cue: impact
    transition_out: {move: matchCut, params: {}}
