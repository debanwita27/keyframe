id: mthblt_A_extremely-happy-to-see-this-website-coming
source: "unknown — no capture URL in analysis folder; folder name implies an @mthblt X/Twitter post"
category: ui-showcase
product_type: visual-product

format:
  aspect: "1116:720"
  fps: 60
  duration_s: 18.133
  orientation: horizontal

verdict: >
  A full-bleed capture of a real (pinned-header, real-scrollbar) product page for AirPods,
  where almost none of the "scroll" is a literal translateY — each capability section is a
  pinned crossfade/zoom driven by scroll progress, and the single moment of true vertical
  scroll is saved for the trailing footer card. The standout invention is a circular
  iris-mask transition whose edge is pre-visualized by concentric ring strokes before the
  mask itself arrives there.

palette:
  bg: "#D8D8D8"
  ink: "#000000"
  accent: "#D848D8"
  support: ["#9018C0", "#4878C0", "#183018", "#7ED321"]
  notes: >
    Each capability section is duotone-coded rather than sharing one accent: magenta/violet
    (#9018C0/#D848D8) for the spatial-audio section, green (#7ED321-ish, matches the real
    AirPods case pairing LED) for the battery/charging section, blue-violet (#4878C0) for
    the durability/running section. Neutral gray (#D8D8D8) and true black are the only
    colours that recur across every section; the "three colours max" rule is deliberately
    broken by rotating a fresh duotone in per act instead.

typography:
  family_look: geometric sans
  weights: [semibold, bold]
  case: sentence
  tracking: tight
  headline_frame_share: 0.34
  notes: >
    All headlines are 1-2 lines, centred, dead-centre of the pinned viewport. The hero
    wordmark ("AirPods") runs smaller at roughly 0.16 frame width; every subsequent
    capability line ("and longer battery life that charges up in a snap.") sits around
    0.34-0.40. No line ever exceeds 2 lines or ~6 words per line.

structure:
  - act: hook
    t: [0.0, 4.38]
    purpose: establish the product name, then dissolve straight into a sensory hook via a circular mask reveal
    shots: [1]
  - act: reveal
    t: [4.4, 8.45]
    purpose: sell the spatial-audio capability against a lifestyle photo, then zoom/match-cut into the real product macro
    shots: [2, 3, 4]
  - act: capability
    t: [8.47, 15.6]
    purpose: chain EQ, physical charging-case interaction and battery life into one long pinned build
    shots: [5]
  - act: proof
    t: [15.62, 16.28]
    purpose: let the battery section fully settle to black before the next capability
    shots: [6]
  - act: proof
    t: [16.3, 18.12]
    purpose: durability proof via a running silhouette, payoff line, then tease the next section with a real scroll
    shots: [7]

shots:
  - n: 1
    t: [0.00, 4.38]
    frames: [0, 263]
    layout: full-bleed-ui
    content: >
      Real captured Apple.com-style AirPods (3rd generation) product page, native browser
      chrome pinned at top (page title left, "Overview / Tech Specs / Compare / Order" tabs
      right), thin native scrollbar visible at the right edge throughout. f0-54: static hero,
      "AirPods" wordmark + "All-new with spatial audio" tagline + two text links, light gray
      bg (#D8D8D8), earbuds product render top-left. f54-64: tagline and links fade out.
      f64-94: "AirPods" wordmark colour-fades from black to transparent in place (no
      transform). f84-114: "It's magic, remastered." crossfades up in the same spot.
      f124-243: small violet ring/squiggle marks (6-8) appear scattered across the frame and
      resolve into two clusters of concentric ring outlines (a sound-wave motif), converging
      toward one centre point as the headline fades out. f244-296: the converged point
      becomes a circular mask that expands from radius 0 to full frame coverage, revealing a
      full-bleed magenta/violet duotone photo underneath; the concentric ring strokes stay
      visible just outside the mask's current edge for the whole expansion, so the wipe's
      future boundary is always pre-drawn.
    moves:
      - move: dissolveBlur
        target: hero_subhead_and_links
        at_f: 54
        params: {opacity: [1, 0], blur_px: [0, 6], dur_f: 10, ease: expoIn}
      - move: dissolveBlur
        target: headline_AirPods_wordmark
        at_f: 64
        params: {opacity: [1, 0], dur_f: 30, ease: expoIn, note: "colour-fade in place, no transform"}
      - move: unblurIn
        target: headline_its_magic_remastered
        at_f: 84
        params: {blur_px: [10, 0], opacity: [0, 1], scale: [1.02, 1], dur_f: 30, ease: expoOut}
      - move: soundRingConverge
