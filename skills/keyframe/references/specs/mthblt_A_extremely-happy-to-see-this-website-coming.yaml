        at_f: 244
        params: {shape: circle, radius_pct: [0, 92], of: frame_height, dur_f: 52, ease: expoInOut, edge_preview: concentric_ring_strokes}
    camera: {move: none, params: {note: "flat page capture, no virtual camera; all motion is content- or scroll-driven"}}
    bg: {kind: flat, moves: [soundRingConverge]}
    treatment: []
    audio_cue: riser
