techniques:
  - id: iris-mask-transition-with-preview-rings
    what: >
      A circular clip-path mask expands from radius 0 to ~92% of frame height (centred
      roughly at 50%, 62%) over 52f, expoInOut, revealing a full-bleed photo underneath a
      flat gray UI layer. For the full 120f leading into the reveal, 2-3 concentric ring
      strokes are already on screen, converging toward the mask's future centre point, so by
      the time the mask starts expanding its eventual edge has effectively been pre-drawn.
    where: shot 1, frames 124-296
    why_it_reads: >
      A plain iris wipe reads as a wipe. Pre-visualizing the mask's edge as ambient ring
      graphics before it moves makes the expansion feel inevitable rather than mechanical —
      the eye already expects a circle there.
    remotion_recipe: >
      Stack two full-frame layers: the outgoing flat UI (bottom) and the incoming photo
      (top), with the photo layer's clip-path set to circle(R% at 50% 62%). Animate R from 0
      to 92 over 52 frames with an expoInOut interpolation. Render the "preview" rings as an
      absolutely-positioned SVG with 2-3 <circle> elements (stroke only, no fill) centred at
      the same point, each with radius = currentR + [8, 20, 36]px and opacity [0.9, 0.5,
      0.2], recomputed every frame from the same R driving the clip-path so the rings and
      the mask edge are mathematically locked together.
    difficulty: moderate

  - id: pinned-scroll-not-translate
    what: >
      Across almost the entire 18s capture, "scrolling" a long product page is implemented
      as a sequence of pinned (position:sticky) full-viewport sections, each entered/exited
      via opacity, blur, scale or mask-radius crossfades driven by scroll progress — never by
      translateY-ing the page content itself. The single exception is the final ~110f, where
      a footer card genuinely translates the page content up by roughly -290px to reveal the
      next section from below the fold.
    where: whole video, explicit exception in shot 7 (frames 1074-1087)
    why_it_reads: >
      Sliding a whole page up past the viewport is legible but reads as "a document." Pinning
      each section and crossfading/zooming its content in place reads as "an experience,"
      because every capability gets to fully occupy the frame instead of sharing it mid-slide.
    remotion_recipe: >
      In a real site, wrap each section in a position:sticky container the height of the
      viewport, and compute a 0-1 progress value per section from either an
      IntersectionObserver or `animation-timeline: view()` / scroll-timeline; drive
      opacity/blur/scale/clip-path off that progress instead of the section's own
      translateY. In Remotion (no real scroll), this is just normal scene sequencing —
      the point to steal is: default to crossfade/zoom/mask transitions between "sections,"
      and reserve literal translateY for one deliberate footer/card-list moment, not the
      whole piece.
    difficulty: moderate

  - id: match-cut-lifestyle-to-studio-product
    what: >
      A lifestyle photo (person wearing the earbud) zooms in on the ear (scale 1→2.4 over
      60f) until the ear fills most of the frame, then the pixel content is swapped for a
      pure-black-background studio product render of the same earbud at the same screen
      position, continuing the zoom without an apparent cut.
    where: shot 2, frames 424-484 (local f160-220)
    why_it_reads: >
      The zoom velocity and shared anatomical anchor point (the ear/earbud) hide the content
      swap; the audience reads one continuous camera move from "worn in real life" to
      "engineered object," which sells craftsmanship without a caption saying so.
    remotion_recipe: >
      Render both the lifestyle-photo layer and the studio-product layer full frame,
      cropped/positioned so the earbud occupies identical screen coordinates in both. Scale
      the top (lifestyle) layer from 1 to ~2.4 over 60f, expoInOut. At the frame where the
      earbud exceeds ~60% of frame area, cut the lifestyle layer's opacity to 0 and the
      product layer's opacity to 1 in a single frame — the swap is invisible because motion
      blur/zoom blur on both layers is at its peak at that instant.
    difficulty: moderate

  - id: shape-clipped-capability-fill
    what: >
      A lightning-bolt glyph scales in, then a repeating diagonal-stripe pattern fills
      outward from inside the bolt's own silhouette, deliberately overflowing past the bolt
      shape to cover the entire frame, before the identical stripe geometry crossfades its
      own palette from light-on-gray to bright-on-near-black.
    where: shot 5, frames 714-864 (local f206-356)
    why_it_reads: >
      Using the capability's own icon as the origin/clip shape for a pattern that then
      breaks its boundary reads as "the feature is so big it can't be contained by its own
      icon" — a purely geometric way to sell scale that never needs a superlative in the copy.
    remotion_recipe: >
      Define the stripe pattern as an SVG <pattern> (or a CSS repeating-linear-gradient) at a
      fixed 60deg angle. Clip it first to the bolt's SVG path via clip-path: path(...), then
      animate a second, larger clip-path (a simple inset or circle) growing from the bolt's
      bounding box out to 150% of the frame diagonal over ~60f, so the pattern reveal reads
      as "starting inside the icon, then escaping it." For the palette swap, render two
      identical pattern layers (light and dark colourways) stacked, and crossfade opacity
      between them over 20f — do not recolour in place, since that requires re-rendering the
      SVG per frame.
    difficulty: moderate

  - id: content-driven-idle-instead-of-camera-drift
    what: >
      During the ~200f static hold on the closed charging case, the only motion is a small
      green pairing-status LED at the case's centre pulsing on a loop (scale 1→1.4, opacity
      1→0.4, ~30f period) — there is no camera drift, breathing scale on the whole frame, or
      background gradient motion.
    where: shot 5, frames 654-714 (local f146-206)
    why_it_reads: >
      Because this is a flat screen-style capture (a real product photo/render, not a 3D
      scene), a whole-frame camera drift would look like an artifact of the capture rather
      than a deliberate effect. A single believable diegetic light (a real product's status
      LED) satisfies "nothing is ever still" without breaking the photographic realism.
    remotion_recipe: >
      Render the LED as a small circle with a radial-gradient fill; drive its scale and
      opacity off `Math.sin(frame / period * 2π)` (or a spring loop) rather than
      `useCurrentFrame()`-agnostic CSS animation. Keep every other element in the shot
      perfectly static — the contrast is what sells the LED as "alive."
    difficulty: trivial

rhythm:
  cut_count: 6
  median_shot_f: 110
  fastest_f: 8
  slowest_f: 429
  pattern: >
    long 264f hook (hero crossfade into iris reveal) then a 223f calm reveal shot, a 21f
    two-part flash-cut burst on the product macro, a 429f capability mega-shot (EQ, case,
    battery, pattern fill, near-static hold), a 41f black settle beat, then a 110f closing
    proof shot that ends mid-scroll into the next section.
  beat_grid_f: 0
  energy_curve: wave

transferable:
  - Use an expanding circle clip-path (radius 0 to ~92% of frame height, ~50f expoInOut) as
    a scene transition, and pre-draw 2-3 concentric ring outlines just outside its current
    edge so the wipe's future boundary is visible before the mask arrives there.
  - Build scroll as pinned per-section opacity/scale/mask crossfades (position:sticky +
    scroll-progress variable), not as one continuous translateY of the whole page; reserve
    literal translateY scroll for a single trailing footer/card reveal.
  - Match-cut a lifestyle shot into a studio product shot by zooming into the exact point
    shared by both (here, the ear) and swapping pixel content only once that point exceeds
    ~60% of frame, so zoom blur hides the swap.
  - Clip a capability's icon-shaped pattern fill so it starts inside the icon's own
    silhouette and then overflows past it to cover the full frame — geometry selling scale
    without adjectives.
  - When a shot is a flat, photographic-style capture with no virtual camera, satisfy "never
    static" with one small diegetic looping light/indicator instead of a whole-frame drift.
  - Color-code each capability section with its own duotone accent instead of holding one
    accent for the whole piece — the video's throughline is neutral gray + black, not a
    single hue.

avoid:
  - The wordmark-to-headline crossfade (f64-114) is a bare opacity fade with no accompanying
    transform, in place — technically breaks "opacity never animates alone." It only reads
    fine here because the type is dead-centred and static; pair with a small blur or scale
    if attempting this in a from-scratch build.
  - Don't hand-key the numeral-glyph wipe frame by frame; use the glyph as a CSS mask-image
    or SVG clipPath on the incoming layer and animate its position/translateX, not manual
    rotoscoping of a bitmap.
  - The three ~10f "hot" micro-shots the automated cut detector reported inside the pattern
    hold (frames 907-936) are near-duplicate frames — shimmer on thin diagonal strokes, not
    a real cut. Don't build the underlying line pattern with fine sub-pixel strokes if
    targeting a clean re-encode; it will alias and read as flicker.

new_moves:
  - name: soundRingConverge
    params: {mark_count: 8, dur_f: 120, ease: expoInOut, converge_to: "x%, y%"}
    description: >
      A scattered set of small ring/squiggle marks across the frame gradually resolve into
      concentric ring outlines and drift toward a single convergence point, typically handing
      off into a mask transition centred on that same point.
  - name: soundRingPulse
    params: {ring_count: 3, period_f: 40, opacity: [0.8, 0], radius_growth_pct: [0, 40]}
    description: >
      3 concentric ring strokes emanate outward on a loop from a fixed anchor point (e.g. an
      earbud in a photo), each ring growing in radius while fading opacity, offset in phase
      — a physical "sound is coming from here" indicator.
  - name: numeralWipeTransition
    params: {glyph: "3", dur_f: 10, dir: left_to_right, ease: expoIn}
    description: >
      A large bold numeral (or any single glyph) is used as a mask-image/clipPath on an
      incoming layer; the glyph translates across the full frame width, revealing the
      incoming layer only where the glyph currently overlaps, then the outgoing layer is
      dropped entirely once the glyph exits.
  - name: diagonalPatternFill
    params: {dur_f: 60, dir: center_outward, stripe_angle_deg: 60, overflow: true}
    description: >
      A repeating diagonal-stripe pattern, initially clipped to an icon's own silhouette,
      grows outward from the icon's centre and is allowed to overflow past the icon's
      boundary until it covers the full frame.
  - name: paletteInvertCrossfade
    params: {from_bg: "#hex", from_stripe: "#hex", to_bg: "#hex", to_stripe: "#hex", dur_f: 20, ease: expoInOut}
    description: >
      Two identical-geometry pattern layers in different colourways (e.g. light-on-gray vs
      bright-on-near-black) are crossfaded via opacity, giving the effect of a palette swap
      without recolouring the pattern in place.
  - name: hingeClose
    params: {rotate_deg: [130, 0], transform_origin: bottom_edge, dur_f: 40, ease: expoInOut}
    description: >
      A lid/flap element rotates closed around a fixed edge (transform-origin pinned to that
      edge, not the element's centre), used for product case lids, laptop lids, book covers.
  - name: scrollCardRise
    params: {page_translateY_px: [0, -290], dur_f: 110, ease: expoOut}
    description: >
      The one genuine vertical-scroll move in an otherwise pinned-crossfade page: the whole
      page content translates up, bringing the next section's card into view from below the
      frame, easing to a stop rather than running continuously.

convergence:
  - The ambient concentric-ring motif that converges before a reveal (soundRingConverge) and
    pulses to indicate a source (soundRingPulse) is the same underlying idea as the
    @byshubh_ corpus's radialRevealGlow — an ambient background element whose state is tied
    to content-reveal progress rather than a fixed timer.
  - The single pulsing pairing-LED used to keep a long static hold alive (see
    content-driven-idle-instead-of-camera-drift) is the same "nothing is ever still" solution
    as the byshubh corpus's `breathe` move on a hero element during a hold.

