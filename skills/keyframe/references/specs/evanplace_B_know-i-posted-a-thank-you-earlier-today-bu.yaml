    To compress this to 25-30s: this is the one reference in the batch that
    should NOT be compressed by trimming shots, because there is only one shot.
    Instead extract only the 2-3 highest-motion-magnitude spans from the motion
    curve (roughly f180-330, f900-1080, and the f1682-1727 sign-off gesture)
    and cut directly between them with hard cuts on the speech beats, discarding
    the long static stretches in between (f0-180, f330-900, f1080-1682) where
    the profile shows sustained low motion (mean 1.8, no local peaks).
  - Do not attempt to manufacture ambient camera drift, grain, or any treatment
    layer on footage like this — it is a documentary/testimonial register,
    and adding polish here would undercut the exact contrast that makes it work.
  - The only usable lesson is structural, not technical - pair one raw,
    unproduced piece against a highly-produced one in a posting sequence to
    make the produced piece read as more considered by contrast.
  - If this had to run in a produced context (e.g. as a testimonial insert
    inside a longer explainer), the move would be a plain scaleIn/staggerRise
    on a simple name-and-role caption lower third, held for the full duration,
    rather than adding any camera or background treatment to the talking head
    itself.

