id: evanplace_A_eventbrite-update-from-one-of-my-favorite
source: local-reference (evanplace_A_eventbrite-update-from-one-of-my-favorite.mp4)
category: launch-video
product_type: brand-only

format:
  aspect: "16:9"
  fps: 30
  duration_s: 52.966
  orientation: horizontal

verdict: >
  A 53-second brand-relaunch reel that treats the identity itself as the hero: a
  9-swatch colour catalogue slides past like paint chips, a photo collage snaps into
  an irregular grid that turns out to be a lit jumbotron, and the mark's own
  silhouette is used as a hard clip for a cycling photo-texture fill. The dozen or
  so lifestyle/proof photos in between are ordinary hardCut B-roll — the craft
  budget is spent entirely on the system-level moments (swatches, grid, mask,
  outline-to-gradient icon fills), not on any single cut.

palette:
  bg: "#F5F0E6"
  ink: "#181818"
  accent: "#F0A8D8"
  support: ["#6078F0", "#D84830", "#D8F0D8", "#6090C0", "#D8D890"]
  notes: >
    Cream (#F5F0E6) and near-black (#181818) alternate as the base canvas roughly
    every other shot — the single "invert once" moment happens repeatedly, on
    purpose, because the video's real subject is a 9-colour brand system, not a
    fixed 3-colour palette. Pink (#F0A8D8) dominates screen-time (17.2% measured)
    and functions as the "primary" accent, but eight other named swatches (Glow
    Brite ~#F0F5D0, Extra Brite ~#D4FF3D, Matcha ~#7C8C4A, Sky Dive ~#7B85F0, Sea
    Glass ~#C8F0E0, Light Rose ~#F4C2DC, Lipstick ~#E31C3D, Fine Wine ~#5C1830,
    Brite Orange ~#FF5A2B) get equal named billing in shot 3's swatch conveyor and
    are re-used as the highlight-chip colours behind headline text throughout the
    film. Rationing rule here is "one colour per beat," not "one accent for the
    whole film."

typography:
  family_look: grotesk
  weights: [bold]
  case: upper
  tracking: tight
  headline_frame_share: 0.55
  notes: >
    Headlines are short (2-5 words), always upper-case, always built one clause at
    a time with a solid-colour "highlighter" block sitting directly behind/around
    each line rather than a background card. Body/UI copy inside phone mockups
    uses the same grotesk at small sizes, sentence case. The wordmark "eventbrite"
    is set in a heavier rounded grotesk, always lower-case, paired with the abstract
    swirl/droplet mark to its left.

structure:
  - act: hook
    t: [0.00, 1.93]
    purpose: Ask the audience's own question ("Looking for something new to do?") in their own idiom before naming the brand.
    shots: [1]
  - act: reveal
    t: [1.97, 6.37]
    purpose: Land the wordmark and show it being chosen/typed into an app, personalising the reveal.
    shots: [2]
  - act: capability
    t: [6.40, 15.93]
    purpose: Show the rebrand as a system — a colour catalogue, an app-icon picker, and a two-line tagline.
    shots: [3, 4, 5]
  - act: proof
    t: [15.97, 26.07]
    purpose: Prove the brand lives across real culture (sport, nature, nightlife) then reveal it in the wild as a lit billboard.
    shots: [6, 7]
  - act: capability
    t: [26.10, 31.13]
    purpose: Show the system extending to social content, merch, and category iconography.
    shots: [8, 9, 10, 11]
  - act: capability
    t: [30.97, 39.10]
    purpose: Let two mascot/icon illustrations slowly gain full colour — the brand's illustration layer at rest.
    shots: [12, 13]
  - act: proof
    t: [39.13, 48.43]
    purpose: Walk the actual product flow (onboarding to ticket-secured) and show the brand mascot in a real-world action photo.
    shots: [14, 15, 16]
  - act: cta
    t: [48.50, 52.97]
    purpose: Show the content library as a scrolling grid, sign off with the tagline, then let the mark cycle its own colour system down to a single dot.
    shots: [17, 18]

