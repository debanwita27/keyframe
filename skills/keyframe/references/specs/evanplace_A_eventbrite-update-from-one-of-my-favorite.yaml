techniques:
  - id: swatch-conveyor-colour-catalogue
    what: >
      A horizontal belt of solid-colour panels, each labelled with its paint name
      in bold upper-case type, with 2-3 panels visible at once; the belt slides
      left continuously so a new named colour enters as the oldest exits, and the
      whole system (9 colours) is shown in ~3.5 seconds.
    where: shot 3, frames 192-301
    why_it_reads: >
      Naming every colour turns an abstract palette into a concrete, memorable
      catalogue (like paint chips at a hardware store) — it sells "we thought
      about every one of these colours" without needing 9 separate slides.
    remotion_recipe: >
      Absolutely-position N panels in a flex row inside a fixed-width viewport with
      overflow:hidden. Drive the row's translateX with
      -frame*slideSpeedPxPerFrame so it scrolls continuously (linear, like
      marquee); each panel is a fixed-width div with background:swatchColor and a
      centred label. No easing on the scroll itself — the "reveal" comes purely
      from panels entering/exiting the viewport edge. Snap-hold on the last panel
      by freezing translateX past a target frame.
    difficulty: trivial

  - id: grid-mosaic-billboard-reveal
    what: >
      Photo fragments from the preceding montage fly inward and lock into an
      irregular, unequal-cell grid that reads as one finished ad graphic (logo
      tile + tagline tile included); the camera then pulls back to reveal the
      grid was actually a lit jumbotron above a real street, with a figure walking
      beneath it.
    where: shot 7, frames 673-782
    why_it_reads: >
      It answers "what does this rebrand look like in the world" in one motion —
      the grid-assembly makes the graphic itself feel constructed from the brand's
      real content, and the pull-back re-contextualises a flat graphic as an
      environmental object, which is a stronger brand-in-context proof than any
      static mockup.
    remotion_recipe: >
      Define a CSS grid with named, unequal track sizes (grid-template-columns/
      rows with mixed fr values) matching the target poster's layout. Each tile is
      a positioned img cropped via object-fit:cover; give each tile a random
      off-grid starting transform (translate + slight rotate) seeded by its grid
      index, and spring/expoOut it to translate:(0,0) rotate:0 with a per-tile
      stagger (tile_stagger_f). Once settled, wrap the whole grid element in a
      second container and animate that container's scale from 1.3 to 1
      (pullOut) while compositing it onto a night-street photo/plate as a
      billboard surface (perspective-corrected via a CSS 3D transform or a simple
      skew if the billboard is near-frontal) — the "reveal" is just changing what
      is drawn behind/around the same grid element.
    difficulty: hard

  - id: mask-is-the-logo-content-fill
    what: >
      The brand mark's exact silhouette is used as a fixed clip region; the
      content visible inside that clip is not a solid fill but a looping
      photo/collage texture, which then crossfades to a smooth two-tone gradient.
      The shape itself never moves or morphs — only what's inside it changes.
    where: shot 12, frames 929-949
    why_it_reads: >
      A recognisable logo shape filled with the brand's own photography reads as
      "this mark contains everything the brand is" in a single glance — it's a
      shape-driven mask where the mask is the subject, not a reveal device, which
      is rare and reads immediately as more considered than a flat icon fill.
    remotion_recipe: >
      clip-path: path('...') or a CSS mask-image using an SVG of the mark
      (mask-image: url(mark.svg); mask-size: contain; mask-repeat: no-repeat) on a
      container. Inside that container, render a looping video/canvas of cropped
      collage photography positioned with object-fit:cover — the mask hard-clips
      it to the mark's exact swirl. To crossfade to a gradient, stack a second
      absolutely-positioned div (background: linear-gradient(...)) with the same
      mask-image applied, and animate its opacity 0->1 over crossfade_dur_f while
      the photo layer's opacity goes 1->0. No morphing SVG path needed since the
      mask geometry is constant — only the masked content changes.
    difficulty: moderate

  - id: outline-to-gradient-icon-fill
    what: >
      A line-art icon (stroke-only, no fill) slowly gains a smooth gradient fill
      over an extended, deliberately slow duration (80f/~2.7s) rather than
      snapping to colour — used back-to-back on two different mascot icons across
      a single 185-frame shot.
    where: shot 13, frames 989-1173
    why_it_reads: >
      Slowing the fill down past what feels "instant" makes an idle hold shot feel
      intentional rather than static — it gives the eye a very low-amplitude event
      to track for the full duration, satisfying the "nothing is ever still" rule
      without adding a camera move.
    remotion_recipe: >
      Render the icon as an SVG with stroke set and fill:none initially. Overlay a
      second identical SVG with the target gradient fill (fill: url(#grad)) and
      animate its opacity from 0 to 1 across dur_f with an expoInOut interpolate —
      cheaper and more reliable than trying to animate an SVG fill colour/gradient
      stop directly. Keep the stroke layer visible throughout (opacity 1) so the
      linework never disappears, only gains colour underneath it.
    difficulty: trivial

  - id: highlighter-chip-headline-build
    what: >
      Headline text builds one line at a time, each new line landing with a
      solid-colour rectangular "highlighter" block sized tightly to that line's
      text (not the whole card), using a different swatch colour per line, and
      previous lines' chips stay visible as later lines are added.
    where: shots 1, 5, 10, 18
    why_it_reads: >
      The highlight block does double duty as emphasis and as a second, hidden
      colour-system showcase (every named swatch from shot 3 reappears here as a
      text-highlight colour) — it reads as "considered graphic design" rather than
      a plain text card, at zero extra production cost over a mask reveal.
    remotion_recipe: >
      Render each line as an inline-block span with a ::before-style absolutely
      positioned block behind it sized to the span's measured offsetWidth/Height
      plus a small padding. Animate the highlight block's scaleX from 0 to 1
      (transform-origin: left) with backOut easing over dur_f, then crossfade the
      text span's opacity in over the back half of the same window so the text
      appears to be "revealed" by the highlighter sweeping under it. Stagger
      additional lines by stagger_from_prev_f. This is a rectangular clip-reveal
      variant already covered by maskWipeSide in spirit, but the highlight block
      persists as visible colour after the reveal instead of disappearing.
    difficulty: trivial

  - id: diagonal-grid-scroll-library
    what: >
      A tilted (~15 degree) grid of many small content thumbnails fills the frame
      and pans continuously along both axes, reading as a scrolling wall of a
      content library/calendar rather than a single flat grid.
    where: shot 18, frames 1515-1548
    why_it_reads: >
      The tilt plus diagonal pan direction (vs. a flat horizontal marquee) sells
      "there is far more of this than fits on screen" — it implies volume and
      variety of brand content in 1.1 seconds without needing to hold on any
      single thumbnail long enough to be read.
    remotion_recipe: >
      Build the grid as a large absolutely-positioned CSS grid (many more cells
      than fit in frame) inside a viewport with overflow:hidden and
      transform:rotate(15deg) applied to the grid's parent container (not the
      viewport, so edges stay hidden). Animate the grid's own translate(x, y)
      linearly frame*speed on both axes simultaneously so the pan reads as
      diagonal within the rotated frame. Repeat/tile the thumbnail set so the pan
      can loop seamlessly if extended.
    difficulty: moderate

rhythm:
  cut_count: 18
  median_shot_f: 78
  fastest_f: 21
  slowest_f: 194
  pattern: >
    58f text hook -> 133f logo/app reveal -> 171f colour-system reel -> two short
    UI/tagline beats (33f, 83f) -> 194f rapid lifestyle montage (itself ~14
    sub-10-30f cuts) -> 110f mosaic-to-billboard reveal -> a cluster of
    short-to-medium capability beats (42f, 21f, 28f, 55f, 60f) -> the 185f longest
    shot (idle icon colour-fill) -> three medium product/proof beats (99f, 91f,
    91f) -> a short merch beat (60f) -> 73f outro (grid scroll -> tagline ->
    logo colour-cycle-to-dot). Energy is a wave: quiet hook, a mid-film peak of
    fast cuts through the montage and mosaic (shots 6-7), a deliberately slow
    idle mid-point (shot 13), then a second smaller peak at the outro.
  beat_grid_f: null
  energy_curve: wave

transferable:
  - >
    Steal the swatch-conveyor (technique swatch-conveyor-colour-catalogue) for any
    brand video that needs to show a colour system as a system — it's a scrolling
    row of labelled divs, not a slideshow of colour cards.
  - >
    Use the mask-is-the-logo-content-fill technique whenever a static logo mark
    needs to feel like it "contains" the brand's content — a constant clip-path
    or mask-image with a swappable layer underneath, no path morphing required.
  - >
    Slow down an icon's colour fill deliberately (outline-to-gradient-icon-fill,
    80f+) instead of snapping it, to give an otherwise-idle hold shot something to
    track — cheaper than adding a camera move and reads as more considered.
  - >
    Reuse the same named colour swatches as both background fills AND
    text-highlight chips throughout a video (highlighter-chip-headline-build) so
    the palette reveal pays off again every time text appears.
  - >
    For a rebrand/relaunch reel, budget almost zero craft on stock B-roll cuts
    (hardCut + a gentle pushIn is enough) and spend the entire effort budget on
    system-level moments — colour catalogue, grid, mask, icon fills — since those
    are what a viewer actually remembers.
  - >
    The grid-mosaic-to-billboard pull-back (grid-mosaic-billboard-reveal) is a
    reusable two-step pattern for any "show the brand in the real world" beat:
    assemble a graphic from fragments, then reveal it was already sitting inside
    an environment.

avoid:
  - >
    The 14-cut lifestyle montage (shot 6, frames 479-672) is licensed/shot stock
    footage with no bespoke motion design beyond a hardCut and a 3% pushIn — do
    not attempt to hand-recreate the photography or add per-cut flourishes; the
    montage's value is its edit rhythm (one cut every ~10-30f), not any individual
    frame.
  - >
    The grid-mosaic-to-billboard shot (shot 7) implies a perspective-corrected
    composite of a flat grid onto a photographed street plate — this needs either
    a pre-warped billboard plate or a real CSS 3D transform matched to the plate's
    vanishing point; don't attempt freehand corner-pinning per frame.
  - >
    The mascot character animation (shot 16, fox-like figure kicking a ball) is a
    pre-made illustrated asset composited over real footage and timed to a real
    person's motion — treat it as a static/simple-transform overlay (scaleIn +
    breathe), not something to rig and re-animate.
  - >
    The two colour-flash bursts inside shots 6 and 9 (4f each) are transition
    punctuation, not content — budget them as a flashCut treatment layer on the
    neighbouring shot, never as their own scene.

new_moves:
  - name: markerHighlightReveal
    params: {dur_f: 9, ease: backOut, highlight_color: "#F0A8D8", stagger_from_prev_f: 9}
    description: >
      A line of text is revealed together with a solid-colour rectangular block
      sized tightly to that line (like a highlighter marker), which scales in on
      the x-axis from 0 to 1 (transform-origin: left) as the text crossfades in
      over the back half of the same window. Multiple lines can stack, each on a
      different highlight_color, with each new line's start offset by
      stagger_from_prev_f from the previous line's start. Distinct from
      maskWipeUp (no vertical translate, no overflow clip) and from maskWipeSide
      (the highlight block persists as visible colour after the reveal instead of
      disappearing).
  - name: paletteCycle
    params: {swap_every_f: 4, n_states: 6, ease: linear}
    description: >
      A single element (a logo, icon, or full-bleed background) cycles through
      n_states discrete colour/bg pairings at a fixed rate of swap_every_f frames
      per state, hard-cutting or very-short-crossfading between states. Used to
      showcase a brand's colour system on one fixed shape rather than one flash
      transition — the content of the cycle is the "reveal," not a device to get
      to the next scene.
  - name: swatchConveyor
    params: {panel_w_pct: 33, slide_speed_px_f: 14, dur_f: 110, label_case: upper, ease: linear}
    description: >
      N solid-colour panels (each labelled with its colour name) sit in a
      horizontal row inside a fixed-width, overflow-hidden viewport and scroll
      continuously left at slide_speed_px_f pixels/frame, so 2-3 panels are
      visible at any time and new ones enter as old ones exit. A named-colour
      catalogue shown as a continuous belt rather than discrete cards.
  - name: gridMosaicAssemble
    params: {grid: "irregular 4x3", tile_stagger_f: 3, fly_from: scattered, dur_f: 34, ease: backOut}
    description: >
      Multiple image/colour tiles, each pre-assigned to a cell in an irregular
      (unequal-size) CSS grid, start from randomised off-grid positions/rotations
      and animate into their grid cell with a per-tile stagger, so the final grid
      reads as one composed graphic rather than a slideshow. Distinct from
      slideStackIn (which is a single-axis vertical stack) — tiles arrive from
      scattered, per-tile-random origins into fixed 2D grid slots.
  - name: logoMaskContentFill
    params: {clip: mark-swirl-path, fill_content: photo-collage-loop, dur_f: 20, then_crossfade_to: gradient-fill, crossfade_dur_f: 14, ease: expoInOut}
    description: >
      A brand mark or icon's silhouette is used as a constant clip-path/mask-image
      region. The content rendered inside that fixed clip (a looping photo
      collage, a video, or a gradient) is swapped or crossfaded over time while
      the mask geometry itself never changes shape. The mask is the subject, not
      a wipe/reveal device — use whenever a logo needs to visually "contain" other
      brand content.
  - name: outlineColorFill
    params: {dur_f: 80, ease: expoInOut, fill_from: outline, fill_to: "gradient(#F0A8D8,#D8F0D8)"}
    description: >
      A stroke-only line-art icon gains a solid or gradient fill by crossfading in
      a second, fully-filled copy of the same SVG on top of the always-visible
      stroke layer, over an intentionally slow dur_f (60-90f) so an otherwise
      idle/hold shot has a continuous low-amplitude event to track.
  - name: diagonalMarquee
    params: {angle_deg: 15, x: [0, "-40%"], y: [0, "25%"], period_f: 34, ease: linear}
    description: >
      A large tiled grid of thumbnails, rotated angle_deg within its viewport,
      pans linearly along both x and y simultaneously so the visible motion reads
      as diagonal scrolling rather than a flat horizontal marquee. Used to imply a
      large scrollable library/calendar of content in a short shot.

convergence:
  - >
    Both this corpus's byshubh_ example (A_explainer-zhylar-crm-cpq) and this
    evanplace reference budget short (<11f) colour/flash cuts as a flashCut
    treatment layer on the neighbouring shot rather than as their own scene —
    documented independently in both specs' detection_notes, suggesting this is a
    genuine cross-designer convention, not house style.
  - >
    Both build a multi-clause headline progressively, one clause/line per
    landing, held complete at the end, rather than typing it or revealing it in
    one piece — zhylar's shot 3 uses maskWipeUp per word-group ("Keeps all" ->
    "...your critical data"); evanplace's shots 1/5/10/18 use
    markerHighlightReveal per line. Different mechanism, same structural pattern:
    assemble the sentence in front of the viewer rather than presenting it whole.

detection_notes: >
  The analyzer's raw cut detector fired 64 shots at delta>26.0; most of these are
  not standalone content beats. Merged into this spec's 18 shots as follows: (1)
  frames 53-58 (6f flash) merged into shot 1 as its exit flashCut. (2) frames
  59-84, 85-133, 134-191 merged into shot 2 — one continuous logo-reveal-to-phone
  beat; the detector split it on the paletteCycle's fast internal colour swaps and
  on the hard cut to the phone. (3) frames 192-237 through 342-362 (17 raw cuts)
  merged into shot 3 — nearly all of these are individual swatch-conveyor slides
  or individual paletteCycle states, i.e. sub-events of one continuous system
  reveal, not separate scenes. (4) frames 396-435 and 436-478 merged into shot 5
  — one two-beat tagline build split by the detector at the bg gradient hard cut.
  (5) frames 479-672 (raw cuts 26-40, 15 shots) merged into shot 6 — each is a
  genuinely distinct photo, but none carries any motion-design beyond a hardCut
  and ambient pushIn, so they are modelled as one montage shot with an enumerated
  hardCut sequence rather than 15 near-identical entries; the three 4f cuts at
  632-643 are true flash punches folded into the sequence. (6) frames 673-724 and
  725-782 merged into shot 7 (mosaic-assemble is inseparable from the billboard
  pull-back it feeds into). (7) frames 783-824 (raw 43-47, including two 4f local
  "text/counter" shots) merged into shot 8 — the local-motion flags are the
  Instagram-story text swap, not a bug. (8) frames 825-873 (raw 48) split across
  this spec's shots 9-10 at the visual scene change (tote bag -> text card) that
  the single-shot detector missed. (9) frames 929-988 and 989-1173 kept as
  separate shots 12-13 per the detector, since they are genuinely distinct scenes
  (mark-mask-fill vs. idle icon holds). The 185f shot 13 (frames 989-1173)
  corresponds to the profile's longest/subtlest entry and was verified against
  the sheets to be a continuous slow colour-fill, not a frozen error — no frozen
  stretch is flagged inside this range. (10) frames 1174-1198, 1199-1213,
  1214-1272 merged into shot 14 (one onboarding-card-cascade beat). (11) frames
  1273-1306 through 1323-1363 merged into shot 15 (one phone-in-hand
  tickets-secured beat). (12) frames 1364-1367, 1368-1371, 1372-1454 merged into
  shot 16 (two 4f flashes folding into the mascot-composite beat). (13) frames
  1455-1458 (4f) merged into the start of shot 17. (14) frames 1459-1514 and
  1515-1587 kept separate as shots 17-18 (merch photography vs. grid-scroll
  outro), with the outro's internal sub-beats (grid scroll -> tagline ->
  logo-cycle) enumerated as moves within shot 18 rather than split further. The
  three profile-flagged frozen stretches (0-18f, 858-872f, 1345-1355f) all land
  on intentional held text/UI states already described above (the hook's opening
  black frame, the "WE'VE GOT WHAT YOU LIKE." hold, and a UI-card hold inside
  shot 15) — none are bugs.
